<title>谢尔宾斯基三角（FR02） | 数学小实验广场</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>

  body.dark .cat-nt { background: #1e3a8a; color: #dbeafe; }

  body.dark .cat-pi { background: #831843; color: #fce7f3; }
  body.dark .cat-gm { background: #064e3b; color: #d1fae5; }

  body.dark .cat-fr { background: #831843; color: #fbcfe8; }

    --accent: #fbbf24;

  }
  body.presenting * {
    font-size: 1.3em !important;
  }
  body.presenting .card { background: #1a1a1a; border: 2px solid #4b5563; padding: 32px; }
  body.presenting .stat { background: #000000; border: 2px solid #4b5563; }
  body.presenting .stat .v { font-size: 2.5em !important; color: #fbbf24 !important; }
  body.presenting .sequence { background: #000000; border: 2px solid #4b5563; color: #ffffff; font-size: 1.2em; }
  body.presenting button.primary { background: #fbbf24; color: #000000; font-weight: 800; font-size: 1.4em; padding: 16px 32px; }
  body.presenting button.ghost { background: #1a1a1a; color: #ffffff; border: 2px solid #4b5563; }

  .card {

    padding: 20px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }

  }

  .intro {

  /* Plaza 4 区样式 */
  .plaza-detail details summary {

  .plaza-detail details summary::-webkit-details-marker { display: none; }

  @media (max-width: 600px) {
    body { font-size: 14px; }
    header { padding: 16px 16px 8px; }
    header h1 { font-size: 20px; }
    nav.tabs { padding: 0 12px; overflow-x: auto; flex-wrap: nowrap; }
    nav.tabs button { padding: 12px 14px; font-size: 14px; white-space: nowrap; }
    .present-btn { padding: 12px 14px; font-size: 13px; }

    .stat .v { font-size: 18px; }

  /* 触摸友好：所有按钮 / 滑块有更大的点击区 */

  /* 实验广场 */
  .plaza-card {

<body>

<header>
  <a href="../index.html" class="back-link">← 返回广场</a>
  <h1>谢尔宾斯基三角 <span class="cat-tag cat-fr" style="font-size: 12px;">分形</span> <span class="id-tag">FR02</span></h1>
  <p>递归：等边三角形挖中间小三角形。</p>
  <div style="position: absolute; top: 16px; right: 24px; display: flex; gap: 8px;">
    <button id="darkToggle" class="ghost small" style="font-size: 12px;">🌙 深色</button>
  </div>
</header>

<section class="tab-panel active" id="plaza">
  <div id="plazaGrid" style="display: none;"></div>
  <div id="plazaCount" style="display: none;"></div>
  <div id="plazaDetail" class="plaza-detail" style="display: block; margin-top: 16px;">
    <p style="text-align: center; color: var(--muted); padding: 40px;">加载中…</p>
  </div>
</section>

<script>
// ========== 1. 共享 JS：8 个 setupXxx + 8 个 HTML 模板常量（含 PLAZA_CATEGORIES）==========

/* ===================== Buffon's Needle ===================== */
const PI = Math.PI;
// Buffon's state - 顶层 let 以便 setupBuffon() 可重复调用
let cv, ctx, errCv, errCtx, errChart;
let L, d;
let needles = []; // {x, y, angle, hit}
let history = []; // {n, piEst}
let ratio, pTheory, sN, sn, sP, sPi, sErr;

const BUFFON_HTML = `
<div class="intro">
  法国博物学家 <strong>Buffon</strong> 1733 年提出：把长度为 L 的针扔到画着等距平行线（间距 d）的纸上，针跨过线的概率
  <strong>P = 2L / (πd)</strong>。反过来，<strong>π ≈ 2L·N / (d·n)</strong>，N = 投掷总次数，n = 跨线次数。
  ——<em>随机里藏着常数</em>。
</div>
<div class="grid">
  <div>
    <div class="card">
      <h2>画布：每一根针都被画下来 <button class="ghost small" id="bDownload" style="float: right; font-size: 12px;">下载 PNG</button></h2>
      <canvas id="buffon-canvas" class="draw" width="720" height="420"></canvas>
      <div class="legend">
        <span class="line">平行线</span>
        <span class="pin">未跨线针</span>
        <span class="hit">跨线针</span>
      </div>
      <p style="font-size: 13px; color: var(--muted); margin-top: 10px;">提示：可以<strong>点画布自己扔一根针</strong>（角度随机），让孩子感受随机；也可以用下方按钮让 AI 自动跑。</p>
    </div>
    <div class="card" style="margin-top: 20px;">
      <h2>误差趋势：π 估值怎么收敛？</h2>
      <div class="chart-wrap"><canvas id="buffon-error"></canvas></div>
    </div>
  </div>
  <div>
    <div class="card">
      <h2>参数</h2>
      <div class="row">
        <label>针长 L (px)<input type="number" id="L" value="50" min="10" max="120"></label>
        <label>线距 d (px)<input type="number" id="d" value="80" min="20" max="200"></label>
      </div>
      <p style="font-size: 13px; color: var(--muted); margin: 8px 0 0;">L/d = <strong id="ratio">0.625</strong>　理论跨线率 P = <strong id="pTheory">39.8%</strong></p>
      <h3>让 AI 投针</h3>
      <div class="row">
        <button class="primary" id="b1">投 1 根</button>
        <button class="primary" id="b100">投 100 根</button>
        <button class="primary" id="b1000">投 1 000 根</button>
        <button class="primary" id="b10000">投 10 000 根</button>
        <button class="ghost" id="bReset">重置</button>
      </div>
    </div>
    <div class="card" style="margin-top: 20px;">
      <h2>实时结果</h2>
      <div class="stat-grid">
        <div class="stat"><div class="k">总投掷 N</div><div class="v" id="sN">0</div></div>
        <div class="stat"><div class="k">跨线 n</div><div class="v" id="sn">0</div></div>
        <div class="stat"><div class="k">实测跨线率</div><div class="v" id="sP">—</div></div>
        <div class="stat big"><div class="k">π 估值</div><div class="v good" id="sPi">—</div></div>
      </div>
      <div class="stat" style="margin-top: 10px;">
        <div class="k">相对误差 |π估值 − π真实| / π</div>
        <div class="v warn" id="sErr">—</div>
      </div>
      <p style="font-size: 12px; color: var(--muted); margin-top: 10px;">π 真实值 = 3.14159265358979...</p>
    </div>
  </div>
</div>
`;

function setupBuffon(root) {
  root.innerHTML = BUFFON_HTML;
  cv  = document.getElementById('buffon-canvas');
  ctx = cv.getContext('2d');
  errCv = document.getElementById('buffon-error');
  errCtx = errCv.getContext('2d');
  L = +document.getElementById('L').value;
  d = +document.getElementById('d').value;
  needles = [];
  history = [];
  ratio = document.getElementById('ratio');
  pTheory = document.getElementById('pTheory');
  sN = document.getElementById('sN');
  sn = document.getElementById('sn');
  sP = document.getElementById('sP');
  sPi = document.getElementById('sPi');
  sErr = document.getElementById('sErr');

  document.getElementById('L').onchange = updateParams;
  document.getElementById('d').onchange = updateParams;
  document.getElementById('b1').onclick = () => drop(1);
  document.getElementById('b100').onclick = () => drop(100);
  document.getElementById('b1000').onclick = () => drop(1000);
  document.getElementById('b10000').onclick = () => drop(10000);
  document.getElementById('bReset').onclick = () => {
    needles = []; history = [];
    drawLines();
    updateStats();

    const halfY = (L/2) * Math.sin(angle);
    const y1 = y - halfY;
    const y2 = y + halfY;
    const lineY1 = Math.floor(y1 / d) * d;
    const lineY2 = Math.floor(y2 / d) * d;
    const hit = (lineY1 !== lineY2);
    const n = { x, y, angle, hit, halfX, halfY };
    needles.push(n);

    for (const nd of needles) drawNeedle(nd, false);

function updateParams() {
  L = +document.getElementById('L').value;
  d = +document.getElementById('d').value;
  ratio.textContent = (L/d).toFixed(3);
  const p = 2 * L / (PI * d);
  pTheory.textContent = (p * 100).toFixed(1) + '%';
  drawLines();
  // 重新画所有针
  redrawAll();
}

function drawLines() {
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.strokeStyle = '#9ca3af';
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 4]);
  for (let y = d; y < cv.height; y += d) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(cv.width, y);
    ctx.stroke();
  }
  ctx.setLineDash([]);
}

function drawNeedle(n, isNew = true) {
  if (isNew) {
    const x = Math.random() * cv.width;
    const y = d/2 + Math.random() * (cv.height - d);
    const angle = Math.random() * PI;
    // 计算离最近水平线的距离（y 是画布 y 坐标）
    // 平行线在 y = d, 2d, 3d, ...
    const yMod = ((y % d) + d) % d;
    const dist = Math.min(yMod, d - yMod);
    // 针端点：(x ± (L/2)cos(angle), y ± (L/2)sin(angle))
    const halfX = (L/2) * Math.cos(angle);
    const halfY = (L/2) * Math.sin(angle);
    // 跨线判定
    const y1 = y - halfY;
    const y2 = y + halfY;
    const lineY1 = Math.floor(y1 / d) * d;
    const lineY2 = Math.floor(y2 / d) * d;
    const hit = (lineY1 !== lineY2);
    n = { x, y, angle, hit, halfX, halfY };
    needles.push(n);
  }
  // 画
  ctx.strokeStyle = n.hit ? '#10b981' : '#ef4444';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(n.x - n.halfX, n.y - n.halfY);
  ctx.lineTo(n.x + n.halfX, n.y + n.halfY);
  ctx.stroke();
  // 中心点
  ctx.fillStyle = n.hit ? '#10b981' : '#ef4444';
  ctx.beginPath();
  ctx.arc(n.x, n.y, 2, 0, 2*PI);
  ctx.fill();
}

function redrawAll() {
  drawLines();
  for (const n of needles) drawNeedle(n, false);
}

function updateStats() {
  const N = needles.length;
  const n = needles.filter(x => x.hit).length;
  sN.textContent = N;
  sn.textContent = n;
  if (N === 0) {
    sP.textContent = '—';
    sPi.textContent = '—';
    sErr.textContent = '—';
    return;
  }
  const p = n / N;
  sP.textContent = (p * 100).toFixed(2) + '%';
  const piEst = (2 * L * N) / (d * n);
  sPi.textContent = piEst.toFixed(5);
  const err = Math.abs(piEst - PI) / PI;
  sErr.textContent = (err * 100).toFixed(2) + '%';
  if (N > 0) {
    history.push({ N, piEst });
    drawErrorChart();
  }
}

function drop(n) {
  for (let i = 0; i < n; i++) {
    const x = Math.random() * cv.width;
    const y = d/2 + Math.random() * (cv.height - d);
    const angle = Math.random() * PI;

    const y1 = y - halfY;
    const y2 = y + halfY;
    const lineY1 = Math.floor(y1 / d) * d;
    const lineY2 = Math.floor(y2 / d) * d;
    const hit = (lineY1 !== lineY2);
    needles.push({ x, y, angle, hit, halfX, halfY });
  }
  // 批量画
  drawLines();

function drawErrorChart() {
  // 降采样：超过 200 点就只画 200 个

}

function collatz(n) {
  // 返回完整序列
  const out = [n];
  while (n !== 1) {
    n = (n % 2 === 0) ? n / 2 : 3 * n + 1;
    out.push(n);
  }
  return out;
}

function collatzUpTo(n, stepLimit = 10000) {
  // 单步版
  let steps = 0;
  let max = n;
  const start = n;
  while (n !== 1 && steps < stepLimit) {
    n = (n % 2 === 0) ? n / 2 : 3 * n + 1;
    steps++;
    if (n > max) max = n;
  }
  return { start, steps, max, done: n === 1, final: n };
}

/* ===================== Pythagorean ===================== */
function gcd(a, b) { return b === 0 ? a : gcd(b, a % b); }
function isPrimitive(m, n) {
  return (m - n) % 2 === 1 && gcd(m, n) === 1;
}
function buildPrimitives(maxC = 1000) {
  const out = [];
  for (let m = 2; m <= 40; m++) {
    for (let n = 1; n < m; n++) {
      if (!isPrimitive(m, n)) continue;
      const a = m*m - n*n;
      const b = 2*m*n;
      const c = m*m + n*n;
      if (c > maxC) continue;
      const triple = [Math.min(a, b), Math.max(a, b), c].sort((x,y)=>x-y);
      out.push({ m, n, a: triple[0], b: triple[1], c: triple[2] });
    }
  }
  return out;
}
const ALL_PY = buildPrimitives(1000);

        mEq:      'm = ?（如 3）',

  });

  document.getElementById('pyNew').onclick = pyReset;

function pyReset() {
  pyRemain = ALL_PY.slice();

  pyUsed = 0;

  pyAnswerEl.style.background = '#fef3c7';
  pyAnswerEl.style.color = '';

  pyUpdateUI();
}

function pyUpdateUI() {
  pyRemainEl.textContent = pyRemain.length;
  pyUsedEl.textContent = pyUsed;
  if (pyRemain.length === 0) {
    pyCandidatesEl.innerHTML = '<em style="color: var(--warn);">候选被排除光了——题目可能出问题</em>';
  } else if (pyRemain.length > 80) {
    pyCandidatesEl.textContent = `（候选 ${pyRemain.length} 个，太多了不全显示）`;
  } else {
    pyCandidatesEl.innerHTML = pyRemain.map(p =>

  ).join('　');
}

function pyContains(triple, digit) {
  return triple.a.toString().includes(digit.toString())
      || triple.b.toString().includes(digit.toString())
      || triple.c.toString().includes(digit.toString());
}

function pyCheck(qText, t) {
  if (qText === 'allOdd') {
    const odd = (t.a % 2 === 1) && (t.b % 2 === 1) && (t.c % 2 === 1);
    return { pass: odd, label: '三边都奇？' };
  }
  if (qText === 'hasEven') {
    const even = [t.a, t.b, t.c].some(x => x % 2 === 0);
    return { pass: even, label: '有偶数边？' };
  }
  return null;
}

function pyValidateInput(mode, val) {
  if (mode === 'allOdd' || mode === 'hasEven') return null;
  if (val === '' || val === null || val === undefined) return '请先输入数字';
  const n = Number(val);
  if (!Number.isInteger(n) || isNaN(n)) return '请输入合法整数';
  if (mode === 'contains') {
    if (n < 0 || n > 9) return '包含数字问题：请输入 0-9 的单个数字';
  } else if (mode === 'maxLess') {
    if (n < 3) return '最大边至少要 ≥ 3（最小勾股数 3-4-5）';
    if (n > 10000) return '最大边请 ≤ 10000（避免候选全空）';
  } else if (mode === 'mEq') {
    if (n < 2 || n > 40) return 'm 取值范围 2-40（公式约束）';
  } else if (mode === 'nEq') {
    if (n < 1 || n > 39) return 'n 取值范围 1-39（公式约束）';
  }
  return null;
}

function pyAsk() {
  if (!pyTarget) { pyReset(); return; }
  const mode = pyQEl.dataset.mode || 'contains';
  let val = pyQEl.value.trim();
  const err = pyValidateInput(mode, val);
  if (err) { alert(err); return; }

  const qKey = `${mode}:${val}`;
  if (pyLastQ === qKey) { alert('同一个问题不要重复提～'); return; }

  let result;
  if (mode === 'contains') {
    const target = pyContains(pyTarget, val);
    result = { pass: target, label: `包含数字 ${val}？` };
  } else if (mode === 'maxLess') {
    const target = pyTarget.c < +val;
    result = { pass: target, label: `最大边 < ${val}？` };
  } else if (mode === 'mEq') {
    const target = pyTarget.m === +val;
    result = { pass: target, label: `m = ${val}？` };
  } else if (mode === 'nEq') {
    const target = pyTarget.n === +val;
    result = { pass: target, label: `n = ${val}？` };
  } else {
    result = pyCheck(mode, pyTarget);
  }

  const beforeFilter = pyRemain.slice();
  pyRemain = pyRemain.filter(t => {
    if (mode === 'contains') return pyContains(t, val) === result.pass;
    if (mode === 'maxLess') return (t.c < +val) === result.pass;
    if (mode === 'mEq') return (t.m === +val) === result.pass;
    if (mode === 'nEq') return (t.n === +val) === result.pass;
    if (mode === 'allOdd') return ((t.a%2===1) && (t.b%2===1) && (t.c%2===1)) === result.pass;
    if (mode === 'hasEven') return [t.a,t.b,t.c].some(x => x%2===0) === result.pass;
    return true;
  });

  if (pyRemain.length === 0) {
    pyRemain = beforeFilter;
    alert('这次提问会把所有候选都排除——已自动撤销。\n试试换个数字或换个问题类型。');
    return;
  }

  pyLastQ = qKey;
  const sign = result.pass ? '✓ 是' : '✗ 否';
  const color = result.pass ? 'var(--good)' : 'var(--warn)';
  const newLog = pyLogEl.innerHTML === '（还没有提问）' ? '' : pyLogEl.innerHTML + '<br>';
  pyLogEl.innerHTML = newLog + `<span style="color: ${color};">${sign}</span> ${result.label}`;

  pyUsed++;
  pyUpdateUI();

  if (pyRemain.length === 1) {
    pyAnswerEl.innerHTML = `✓ 候选只剩 1 个：<strong>(${pyRemain[0].a}, ${pyRemain[0].b}, ${pyRemain[0].c})</strong>　<span style="color: var(--muted);">用 ${pyUsed} 步猜中</span>`;
    pyAnswerEl.style.background = '#ecfdf5';
    pyAnswerEl.style.color = '#065f46';
  }
  pyQEl.value = '';
}

function updateFactory() {
  let m = +mSlider.value;
  let n = +nSlider.value;
  if (n >= m) { n = m - 1; nSlider.value = n; }
  mVal.textContent = m;
  nVal.textContent = n;
  const a = m*m - n*n;
  const b = 2*m*n;
  const c = m*m + n*n;
  const sorted = [a, b, c].sort((x,y) => x - y);
  aOut.textContent = sorted[0];
  bOut.textContent = sorted[1];
  cOut.textContent = sorted[2];
  const prim = isPrimitive(m, n);
  if (prim) {
    pyCheckEl.innerHTML = `✓ 是本原（gcd=1, m−n 奇 = ${m-n}）`;
    pyCheckEl.style.color = '#059669';
  } else {
    const reason = (m-n) % 2 === 0 ? 'm−n 是偶数' : `gcd(m,n)=${gcd(m,n)}`;
    pyCheckEl.innerHTML = `✗ 非本原（${reason}）—— 答案会被缩放`;
    pyCheckEl.style.color = '#dc2626';
  }
}

  } else {
    const n = Math.max(5, Math.min(20, +fcNEl.value || 14));

function fcVoroGenerate(n) {
  const seeds = [];
  const W = FC_CANVAS, H = FC_CANVAS;
  let attempts = 0;
  while (seeds.length < n && attempts < 200) {
    attempts++;
    const p = { x: 30 + Math.random() * (W - 60), y: 30 + Math.random() * (H - 60) };
    let ok = true;
    for (const s of seeds) {
      const d = Math.hypot(p.x - s.x, p.y - s.y);
      if (d < 50) { ok = false; break; }
    }
    if (ok) { p.id = seeds.length; seeds.push(p); }
  }
  fcVoroSeeds = seeds;
  const cellSize = FC_VORO_CELL;
  fcRows = Math.floor(H / cellSize);
  fcCols = Math.floor(W / cellSize);
  fcCellPx = cellSize;
  fcVoroRegion = Array.from({ length: fcRows }, () => Array(fcCols).fill(0));
  fcGrid = Array.from({ length: fcRows }, () => Array(fcCols).fill(0));
  for (let y = 0; y < fcRows; y++) {
    for (let x = 0; x < fcCols; x++) {
      const px = x * cellSize + cellSize / 2;
      const py = y * cellSize + cellSize / 2;
      let minD = Infinity, minId = 0;
      for (const s of seeds) {
        const d = (px - s.x) ** 2 + (py - s.y) ** 2;
        if (d < minD) { minD = d; minId = s.id; }
      }
      fcVoroRegion[y][x] = minId;
    }
  }
}

          line.setAttribute('x1', (x + 1) * fcCellPx); line.setAttribute('y1', y * fcCellPx);

          line.setAttribute('stroke', '#1f2937'); line.setAttribute('stroke-width', 1.2);
          line.setAttribute('opacity', 0.3); line.style.pointerEvents = 'none';
          fcSvg.appendChild(line);
        }
        if (y + 1 < fcRows && fcVoroRegion[y+1][x] !== reg) {
          const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
          line.setAttribute('x1', x * fcCellPx); line.setAttribute('y1', (y + 1) * fcCellPx);
          line.setAttribute('x2', (x + 1) * fcCellPx); line.setAttribute('y2', (y + 1) * fcCellPx);
          line.setAttribute('stroke', '#1f2937'); line.setAttribute('stroke-width', 1.2);
          line.setAttribute('opacity', 0.3); line.style.pointerEvents = 'none';
          fcSvg.appendChild(line);
        }
      }
    }
    const centers = fcVoroSeeds.map(s => ({ x: s.x, y: s.y, id: s.id, count: 0, sumX: 0, sumY: 0 }));
    for (let y = 0; y < fcRows; y++) {
      for (let x = 0; x < fcCols; x++) {
        const r = fcVoroRegion[y][x];
        centers[r].sumX += x * fcCellPx + fcCellPx / 2;
        centers[r].sumY += y * fcCellPx + fcCellPx / 2;
        centers[r].count++;
      }
    }
    centers.forEach((c) => {
      if (c.count === 0) return;
      const cx = c.sumX / c.count;
      const cy = c.sumY / c.count;
      const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      text.setAttribute('x', cx); text.setAttribute('y', cy + 4);
      text.setAttribute('text-anchor', 'middle'); text.setAttribute('fill', '#1f2937');
      text.setAttribute('font-size', 11); text.setAttribute('font-weight', 700);
      text.setAttribute('opacity', 0.6); text.textContent = c.id + 1;
      text.style.pointerEvents = 'none';
      fcSvg.appendChild(text);
    });
  }
}

function fcClick(r, c) {
  if (fcThreeOnly && fcCurrent === 4) return;
  fcGrid[r][c] = fcGrid[r][c] === fcCurrent ? 0 : fcCurrent;
  fcRenderGrid();
  fcUpdateStats();
}

function fcUpdateStats() {
  let filled = 0, conflicts = 0, used = new Set();
  for (let r = 0; r < fcRows; r++) {
    for (let c = 0; c < fcCols; c++) {
      const v = fcGrid[r][c];
      if (v === 0) continue;
      filled++;
      used.add(v);
      if (c + 1 < fcCols && fcGrid[r][c+1] === v) conflicts++;
      if (r + 1 < fcRows && fcGrid[r+1][c] === v) conflicts++;
    }
  }
  const regionFilled = new Set();
  if (fcMapType === 'voro') {
    for (let r = 0; r < fcRows; r++) {
      for (let c = 0; c < fcCols; c++) {
        if (fcGrid[r][c] !== 0) regionFilled.add(fcVoroRegion[r][c]);
      }
    }
  } else {
    regionFilled.size = filled;
  }
  fcFilledEl.textContent = fcMapType === 'voro' ? regionFilled.size : filled;
  fcConflictEl.textContent = conflicts;
  fcColorsEl.textContent = used.size;
  if (filled === 0) {
    fcVerdictEl.textContent = '—';
    fcVerdictEl.style.color = '';
  } else if (conflicts === 0) {
    const need = fcMapType === 'voro' ? regionFilled.size : filled;
    const total = fcMapType === 'voro' ? fcVoroSeeds.length : FC_GRID_SIZE * FC_GRID_SIZE;
    if (need < total) {
      fcVerdictEl.textContent = `✓ 无冲突（${need}/${total}）`;
      fcVerdictEl.style.color = 'var(--good)';
    } else {
      fcVerdictEl.textContent = `✓ 完成！用了 ${used.size} 种颜色`;
      fcVerdictEl.style.color = 'var(--good)';
    }
  } else {
    fcVerdictEl.textContent = `✗ ${conflicts} 处冲突`;
    fcVerdictEl.style.color = 'var(--warn)';
  }
}

function fcAuto4Color() {
  const g = fcGrid.map(row => row.slice());
  const isOK = (r, c, v) => {
    if (c > 0 && g[r][c-1] === v) return false;
    if (r > 0 && g[r-1][c] === v) return false;
    return true;
  };
  for (let pass = 0; pass < 4; pass++) {
    let changed = false;
    for (let r = 0; r < fcRows; r++) {
      for (let c = 0; c < fcCols; c++) {
        if (g[r][c] !== 0) continue;
        for (let v = 1; v <= 4; v++) {
          if (isOK(r, c, v)) { g[r][c] = v; changed = true; break; }
        }
      }
    }
    if (!changed) break;
  }
  for (let r = 0; r < fcRows; r++) {
    for (let c = 0; c < fcCols; c++) {
      if (g[r][c] === 0) g[r][c] = 1;
    }
  }
  fcGrid = g;
  fcRenderGrid();
  fcUpdateStats();
}

let rmEdges = [];
let rmPoints = [];
let rmSvg, rmRedEl, rmBlueEl, rmTriEl, rmStatResult;

const RAMSEY_HTML = `

function setupRamsey(root) {
  root.innerHTML = RAMSEY_HTML;

      for (let i = 0; i < 6 && !hasMono; i++) {
        for (let j = i+1; j < 6 && !hasMono; j++) {
          for (let k = j+1; k < 6 && !hasMono; k++) {
            const a = edges[i*5 - i*(i-1)/2 + (j-i-1)];
            const b = edges[j*5 - j*(j-1)/2 + (k-j-1)];
            const c = edges[i*5 - i*(i-1)/2 + (k-i-1)];
            if (a === b && a === c) hasMono = true;
          }
        }
      }

}

function rmPos() {
  const cx = 240, cy = 210, R = 140;
  rmPoints = [];
  for (let i = 0; i < RM_N; i++) {
    const a = -Math.PI / 2 + i * 2 * Math.PI / RM_N;
    rmPoints.push({ x: cx + R * Math.cos(a), y: cy + R * Math.sin(a), i });
  }
}

function rmEdgeIdx(i, j) {
  if (i > j) [i, j] = [j, i];
  return i * (RM_N - 1) - i * (i - 1) / 2 + (j - i - 1);
}

function rmRender() {
  rmPos();
  rmSvg.innerHTML = '';
  const tri = rmFindTriangles();
  tri.forEach(([a, b, c]) => {
    [[a,b],[b,c],[c,a]].forEach(([i, j]) => {
      const p1 = rmPoints[i], p2 = rmPoints[j];
      const hl = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      hl.setAttribute('x1', p1.x); hl.setAttribute('y1', p1.y);
      hl.setAttribute('x2', p2.x); hl.setAttribute('y2', p2.y);
      hl.setAttribute('stroke', '#fbbf24'); hl.setAttribute('stroke-width', 8);
      hl.setAttribute('opacity', 0.6); hl.setAttribute('stroke-linecap', 'round');
      rmSvg.appendChild(hl);
    });
  });
  for (let i = 0; i < RM_N; i++) {
    for (let j = i+1; j < RM_N; j++) {
      const idx = rmEdgeIdx(i, j);
      const red = rmEdges[idx];
      const p1 = rmPoints[i], p2 = rmPoints[j];
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', p1.x); line.setAttribute('y1', p1.y);
      line.setAttribute('x2', p2.x); line.setAttribute('y2', p2.y);
      line.setAttribute('stroke', red === null ? '#9ca3af' : (red ? '#ef4444' : '#2563eb'));
      line.setAttribute('stroke-width', red === null ? 1 : 2.5);
      line.setAttribute('stroke-dasharray', red === null ? '4 4' : '0');
      line.style.cursor = 'pointer';
      line.onclick = () => {
        if (rmEdges[idx] === null) rmEdges[idx] = true;
        else if (rmEdges[idx] === true) rmEdges[idx] = false;
        else rmEdges[idx] = null;
        rmRender();
        rmUpdateStats();
      };
      rmSvg.appendChild(line);
    }
  }
  rmPoints.forEach((p, idx) => {
    const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    c.setAttribute('cx', p.x); c.setAttribute('cy', p.y); c.setAttribute('r', 22);
    c.setAttribute('fill', '#fff'); c.setAttribute('stroke', '#1f2937'); c.setAttribute('stroke-width', 2);
    rmSvg.appendChild(c);
    const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    t.setAttribute('x', p.x); t.setAttribute('y', p.y + 5);
    t.setAttribute('text-anchor', 'middle'); t.setAttribute('font-size', 16); t.setAttribute('font-weight', 700);
    t.textContent = idx + 1; t.style.pointerEvents = 'none';
    rmSvg.appendChild(t);
  });
}

function rmFindTriangles() {
  const tris = [];
  for (let i = 0; i < RM_N; i++) {
    for (let j = i+1; j < RM_N; j++) {
      for (let k = j+1; k < RM_N; k++) {
        const a = rmEdges[rmEdgeIdx(i, j)];
        const b = rmEdges[rmEdgeIdx(j, k)];
        const c = rmEdges[rmEdgeIdx(i, k)];
        if (a !== null && a === b && a === c) tris.push([i, j, k]);
      }
    }
  }
  return tris;
}

function rmUpdateStats() {
  let red = 0, blue = 0;
  for (const e of rmEdges) {
    if (e === true) red++;
    else if (e === false) blue++;
  }
  rmRedEl.textContent = red;
  rmBlueEl.textContent = blue;
  const tri = rmFindTriangles();
  rmTriEl.textContent = tri.length;
  rmTriEl.style.color = tri.length > 0 ? '#059669' : '';
}

function rmRandomFill(pRed = 0.5, forceAll = true) {
  rmEdges = Array(RM_N * (RM_N - 1) / 2).fill(null);
  for (let idx = 0; idx < rmEdges.length; idx++) {
    if (forceAll || Math.random() < 0.9) {
      rmEdges[idx] = Math.random() < pRed;
    }
  }
  rmRender();
  rmUpdateStats();
}

function rmK5NoMono() {
  rmEdges = Array(RM_N * (RM_N - 1) / 2).fill(null);
  for (let j = 0; j < RM_N; j++) {
    if (j !== 5) rmEdges[rmEdgeIdx(5, j)] = false;
  }
  const ring = [0, 1, 2, 3, 4];
  for (let i = 0; i < 5; i++) {
    const a = ring[i], b = ring[(i+1) % 5];
    rmEdges[rmEdgeIdx(a, b)] = true;
  }
  for (let i = 0; i < 5; i++) {
    for (let j = i+2; j < 5; j++) {
      const a = ring[i], b = ring[j];
      if (rmEdges[rmEdgeIdx(a, b)] === null) {
        rmEdges[rmEdgeIdx(a, b)] = false;
      }
    }
  }
  rmRender();
  rmUpdateStats();
}

function setupGoldbach(root) {
  root.innerHTML = GOLDBACH_HTML;

  gbN.onkeypress = e => { if (e.key === 'Enter') gbFindPairs(); };
  gbScanN.onkeypress = e => { if (e.key === 'Enter') gbScan(); };

function sieve(n) {
  const isPrime = new Uint8Array(n + 1).fill(1);
  isPrime[0] = isPrime[1] = 0;
  for (let i = 2; i * i <= n; i++) {
    if (isPrime[i]) {
      for (let j = i * i; j <= n; j += i) isPrime[j] = 0;
    }
  }
  return isPrime;
}

function gbDecompose(N, isPrime) {
  const pairs = [];
  for (let p = 2; p <= N/2; p++) {
    if (isPrime[p] && isPrime[N - p]) {
      pairs.push([p, N - p]);
    }
  }
  return pairs;
}

function gbFindPairs() {
  const N = +gbN.value;
  if (N < 4 || N % 2 !== 0) {
    alert('请输入 ≥ 4 的偶数');
    return;
  }
  if (N > 100000) {
    alert('为避免卡顿，请输入 ≤ 100000 的偶数');
    return;
  }
  const isPrime = sieve(N);
  const pairs = gbDecompose(N, isPrime);
  if (pairs.length === 0) {
    gbList.innerHTML = `<em style="color: var(--warn);">N = ${N} 没找到配对（这本身就是反例！）</em>`;
    gbCountEl.textContent = '0';
    gbVerdictEl.textContent = '✗ 反例！';
    gbVerdictEl.style.color = 'var(--warn)';
  } else {
    gbList.innerHTML = pairs.map(([a, b]) =>
      `<strong style="color: var(--accent);">${a} + ${b} = ${N}</strong>`
    ).join('　');
    gbCountEl.textContent = pairs.length;
    gbVerdictEl.textContent = '✓ 配成';
    gbVerdictEl.style.color = 'var(--good)';
  }
}

function gbScan() {
  const N = +gbScanN.value;
  if (N < 10 || N > 50000) {
    alert('扫描范围 10 ≤ N ≤ 50000');
    return;
  }
  const isPrime = sieve(N);
  let total = 0, ok = 0, failList = [];
  for (let n = 4; n <= N; n += 2) {
    total++;
    let found = false;
    for (let p = 2; p <= n/2; p++) {
      if (isPrime[p] && isPrime[n - p]) { found = true; break; }
    }
    if (found) ok++;
    else failList.push(n);
  }
  gbTotalEl.textContent = total;
  gbOkEl.textContent = `${ok} (${(ok/total*100).toFixed(2)}%)`;
  gbOkEl.style.color = ok === total ? 'var(--good)' : 'var(--warn)';
  if (failList.length > 0) {
    alert(`找到反例！N = ${failList.join(', ')}`);
  }
}

/* ===================== 通用：下载 PNG ===================== */
function downloadDataUrl(dataUrl, filename) {
  const a = document.createElement('a');
  a.download = filename;
  a.href = dataUrl;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}
function svgToPng(svgEl) {
  return new Promise((resolve) => {
    try {
      const xml = new XMLSerializer().serializeToString(svgEl);
      const svg64 = btoa(unescape(encodeURIComponent(xml)));
      const img = new Image();
      img.onload = () => {
        const w = svgEl.clientWidth || svgEl.viewBox.baseVal.width || 360;
        const h = svgEl.clientHeight || svgEl.viewBox.baseVal.height || 360;
        const scale = 2;
        const canvas = document.createElement('canvas');
        canvas.width = w * scale;
        canvas.height = h * scale;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/png'));
      };
      img.onerror = () => resolve(null);
      img.src = 'data:image/svg+xml;base64,' + svg64;
    } catch (e) { resolve(null); }
  });
}
function downloadCanvas(canvas, filename) {
  // 给 canvas 周围加白底
  const w = canvas.width, h = canvas.height;
  const out = document.createElement('canvas');
  out.width = w; out.height = h;
  const ctx = out.getContext('2d');
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, w, h);
  ctx.drawImage(canvas, 0, 0);
  downloadDataUrl(out.toDataURL('image/png'), filename);
}

/* ===================== 通用工具函数 ===================== */
function sumDigits(n) {
  n = Math.abs(n);
  let s = 0;
  while (n > 0) { s += n % 10; n = Math.floor(n / 10); }
  return s;
}
function factorize(n) {
  const out = [];
  for (let p = 2; p * p <= n; p++) {
    while (n % p === 0) { out.push(p); n = n / p; }
  }
  if (n > 1) out.push(n);
  return out;
}
function isPrimeSmall(n) {
  if (n < 2) return false;
  if (n < 4) return true;
  if (n % 2 === 0) return false;
  for (let p = 3; p * p <= n; p += 2) {
    if (n % p === 0) return false;
  }
  return true;
}
function divisors(n) {
  const out = [];
  for (let i = 1; i <= n; i++) if (n % i === 0) out.push(i);
  return out;
}
function properDivisors(n) { return divisors(n).filter(d => d < n); }
function factorial(n) {
  let r = 1; for (let i = 2; i <= n; i++) r *= i; return r;
}
function gcd(a, b) { return b === 0 ? a : gcd(b, a % b); }
function lcm(a, b) { return Math.abs(a * b) / gcd(a, b); }

function tpScan() {
  const N = +tpN.value;
  if (N < 100) { alert('至少扫 100'); return; }
  if (N > 500000) { alert('最多扫 500000'); return; }
  tpStatus.textContent = '扫描中…';
  tpRun.disabled = true;
  setTimeout(() => {
    const isPrime = sieve(N + 2);
    const pairs = [];
    let primeTotal = 0;
    for (let i = 2; i <= N; i++) {
      if (isPrime[i]) {
        primeTotal++;
        if (isPrime[i + 2]) pairs.push([i, i + 2]);
      }
    }
    tpChart.data.datasets[0].data = pairs.map(p => ({ x: p[0], y: p[1] }));
    tpChart.data.datasets[0].pointBackgroundColor = pairs.length > 2000 ? 'rgba(37,99,235,0.4)' : '#2563eb';
    tpChart.data.datasets[0].pointRadius = pairs.length > 2000 ? 1.5 : 3;
    tpChart.update();
    tpPrimeTotal.textContent = primeTotal;
    tpTwinCount.textContent = pairs.length;
    tpRatio.textContent = primeTotal > 0 ? (pairs.length / primeTotal * 100).toFixed(1) + '%' : '0';
    if (pairs.length > 0) {
      const last = pairs[pairs.length - 1];
      tpLargest.textContent = `(${last[0]}, ${last[1]})`;
    } else {
      tpLargest.textContent = '—';
    }
    tpStatus.textContent = `扫完 1–${N}，找到 ${pairs.length} 对孪生素数`;
    tpRun.disabled = false;
  }, 50);
}

function tpCheckOne() {
  const n = +tpCheck.value;
  if (n < 2) { alert('请输入 ≥ 2 的正整数'); return; }
  const isPrime = sieve(n + 2);
  const p1 = isPrime[n] === 1;
  const p2 = isPrime[n + 2] === 1;
  tpIsP1.textContent = p1 ? '✓ 素数' : '✗ 不是';
  tpIsP1.style.color = p1 ? '#059669' : '#dc2626';
  tpIsP2.textContent = p2 ? '✓ 素数' : '✗ 不是';
  tpIsP2.style.color = p2 ? '#059669' : '#dc2626';
  const isTwin = p1 && p2;
  tpIsTwin.textContent = isTwin ? `✓ ${n} 和 ${n+2} 是孪生素数` : `✗ 不是孪生素数`;
  tpIsTwin.style.color = isTwin ? '#059669' : '#dc2626';
}

function archimedesPi(n) {
  return n * Math.sin(Math.PI / n);
}

function leibnizPi(N) {
  let s = 0;
  for (let k = 0; k < N; k++) {
    s += (k % 2 === 0 ? 1 : -1) / (2 * k + 1);
  }
  return 4 * s;
}

function arctan(x, N) {
  let s = 0;
  let x2k1 = x;
  for (let k = 0; k < N; k++) {
    s += (k % 2 === 0 ? 1 : -1) * x2k1 / (2 * k + 1);
    x2k1 *= x * x;
  }
  return s;
}

function machinPi(N) {
  return 4 * (4 * arctan(1/5, N) - arctan(1/239, N));
}

function chudnovskyPi(N) {
  const C = 426880 * Math.sqrt(10005);
  let sum = 0;
  for (let k = 0; k < N; k++) {
    let num = 1;
    for (let i = 1; i <= 6 * k; i++) num *= i;
    let den = 1;
    for (let i = 1; i <= 3 * k; i++) den *= i;
    let kFact = 1;
    for (let i = 1; i <= k; i++) kFact *= i;
    den *= kFact * kFact * kFact;
    const term = num / den * (545140134 * k + 13591409) / Math.pow(640320, 3 * k);
    sum += (k % 2 === 0 ? 1 : -1) * term;
  }
  return C / sum;
}

function piRunAll() {
  const N = +piN.value;
  if (N < 1) { alert('至少 1 项'); return; }
  if (N > 100000) { alert('最多 100000 项（Leibniz 太慢）'); return; }
  piStatus.textContent = '计算中…';
  piRun.disabled = true;
  setTimeout(() => {
    const samples = Math.min(N, 50);
    const labels = [];
    const dataA = [], dataL = [], dataM = [], dataC = [];
    for (let s = 1; s <= samples; s++) {
      labels.push(s);
      const aSides = 6 * Math.pow(2, s - 1);
      dataA.push(archimedesPi(aSides));
      dataL.push(leibnizPi(s * Math.ceil(N / samples)));
      dataM.push(machinPi(s * Math.ceil(N / samples)));
      dataC.push(chudnovskyPi(s));
    }
    piChart.data.labels = labels;
    piChart.data.datasets[0].data = dataA;
    piChart.data.datasets[1].data = dataL;
    piChart.data.datasets[2].data = dataM;
    piChart.data.datasets[3].data = dataC;
    piChart.update();
    piA.textContent = dataA[dataA.length - 1].toFixed(8);
    piL.textContent = dataL[dataL.length - 1].toFixed(8);
    piM.textContent = dataM[dataM.length - 1].toFixed(8);
    piC.textContent = dataC[dataC.length - 1].toFixed(8);
    piStatus.textContent = `算完 N=${N}，采样 ${samples} 次`;
    piRun.disabled = false;
  }, 50);
}

    const audios = document.querySelectorAll('audio[src*="audio/"]');
    audios.forEach(a => { a.src = '../' + a.getAttribute('src'); });
    const links = document.querySelectorAll('a[href*="audio/"]');
    links.forEach(l => { l.href = '../' + l.getAttribute('href'); });
  } catch (e) {
    document.getElementById('plazaDetail').innerHTML = '<pre style="color:red; padding:20px;">错误: ' + e.message + '\n\n' + e.stack + '</pre>';
  }

  // 深色模式
  const darkBtn = document.getElementById('darkToggle');
  if (darkBtn) {
    darkBtn.onclick = () => {
      document.body.classList.toggle('dark');
      darkBtn.textContent = document.body.classList.contains('dark') ? '☀️ 浅色' : '🌙 深色';
    };
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initPage);
} else {
  initPage();
}
</script>
</body>
</html>

// ========== 1. 共享 JS：8 个 setupXxx + 8 个 HTML 模板常量（含 PLAZA_CATEGORIES）==========

/* ===================== Buffon's Needle ===================== */
const PI = Math.PI;
// Buffon's state - 顶层 let 以便 setupBuffon() 可重复调用
let cv, ctx, errCv, errCtx, errChart;
let L, d;
let needles = []; // {x, y, angle, hit}
let history = []; // {n, piEst}
let ratio, pTheory, sN, sn, sP, sPi, sErr;

const BUFFON_HTML = `
<div class="intro">
  法国博物学家 <strong>Buffon</strong> 1733 年提出：把长度为 L 的针扔到画着等距平行线（间距 d）的纸上，针跨过线的概率
  <strong>P = 2L / (πd)</strong>。反过来，<strong>π ≈ 2L·N / (d·n)</strong>，N = 投掷总次数，n = 跨线次数。
  ——<em>随机里藏着常数</em>。
</div>
<div class="grid">
  <div>
    <div class="card">
      <h2>画布：每一根针都被画下来 <button class="ghost small" id="bDownload" style="float: right; font-size: 12px;">下载 PNG</button></h2>
      <canvas id="buffon-canvas" class="draw" width="720" height="420"></canvas>
      <div class="legend">
        <span class="line">平行线</span>
        <span class="pin">未跨线针</span>
        <span class="hit">跨线针</span>
      </div>
      <p style="font-size: 13px; color: var(--muted); margin-top: 10px;">提示：可以<strong>点画布自己扔一根针</strong>（角度随机），让孩子感受随机；也可以用下方按钮让 AI 自动跑。</p>
    </div>
    <div class="card" style="margin-top: 20px;">
      <h2>误差趋势：π 估值怎么收敛？</h2>
      <div class="chart-wrap"><canvas id="buffon-error"></canvas></div>
    </div>
  </div>
  <div>
    <div class="card">

function updateParams() {
  L = +document.getElementById('L').value;
  d = +document.getElementById('d').value;
  ratio.textContent = (L/d).toFixed(3);

  pTheory.textContent = (p * 100).toFixed(1) + '%';
  drawLines();
  // 重新画所有针
  redrawAll();
}

function drawLines() {
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.strokeStyle = '#9ca3af';
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 4]);
  for (let y = d; y < cv.height; y += d) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(cv.width, y);
    ctx.stroke();
  }
  ctx.setLineDash([]);
}

function drawNeedle(n, isNew = true) {
  if (isNew) {
    const x = Math.random() * cv.width;
    const y = d/2 + Math.random() * (cv.height - d);
    const angle = Math.random() * PI;
    // 计算离最近水平线的距离（y 是画布 y 坐标）
    // 平行线在 y = d, 2d, 3d, ...
    const yMod = ((y % d) + d) % d;
    const dist = Math.min(yMod, d - yMod);
    // 针端点：(x ± (L/2)cos(angle), y ± (L/2)sin(angle))
    const halfX = (L/2) * Math.cos(angle);
    const halfY = (L/2) * Math.sin(angle);
    // 跨线判定
    const y1 = y - halfY;
    const y2 = y + halfY;
    const lineY1 = Math.floor(y1 / d) * d;
    const lineY2 = Math.floor(y2 / d) * d;
    const hit = (lineY1 !== lineY2);
    n = { x, y, angle, hit, halfX, halfY };
    needles.push(n);
  }
  // 画
  ctx.strokeStyle = n.hit ? '#10b981' : '#ef4444';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(n.x - n.halfX, n.y - n.halfY);
  ctx.lineTo(n.x + n.halfX, n.y + n.halfY);
  ctx.stroke();
  // 中心点
  ctx.fillStyle = n.hit ? '#10b981' : '#ef4444';
  ctx.beginPath();
  ctx.arc(n.x, n.y, 2, 0, 2*PI);
  ctx.fill();
}

function redrawAll() {
  drawLines();
  for (const n of needles) drawNeedle(n, false);
}

function updateStats() {
  const N = needles.length;
  const n = needles.filter(x => x.hit).length;
  sN.textContent = N;
  sn.textContent = n;
  if (N === 0) {
    sP.textContent = '—';
    sPi.textContent = '—';
    sErr.textContent = '—';
    return;
  }
  const p = n / N;
  sP.textContent = (p * 100).toFixed(2) + '%';
  const piEst = (2 * L * N) / (d * n);
  sPi.textContent = piEst.toFixed(5);
  const err = Math.abs(piEst - PI) / PI;
  sErr.textContent = (err * 100).toFixed(2) + '%';
  if (N > 0) {
    history.push({ N, piEst });
    drawErrorChart();
  }
}

function drop(n) {
  for (let i = 0; i < n; i++) {
    const x = Math.random() * cv.width;
    const y = d/2 + Math.random() * (cv.height - d);
    const angle = Math.random() * PI;
    const halfX = (L/2) * Math.cos(angle);
    const halfY = (L/2) * Math.sin(angle);
    const y1 = y - halfY;
    const y2 = y + halfY;
    const lineY1 = Math.floor(y1 / d) * d;
    const lineY2 = Math.floor(y2 / d) * d;
    const hit = (lineY1 !== lineY2);
    needles.push({ x, y, angle, hit, halfX, halfY });
  }
  // 批量画
  drawLines();
  for (const nd of needles) drawNeedle(nd, false);
  updateStats();
}

function drawErrorChart() {
  // 降采样：超过 200 点就只画 200 个
  let sample = history;
  if (history.length > 300) {
    const step = Math.ceil(history.length / 300);
    sample = history.filter((_, i) => i % step === 0);

  errChart.data.labels = sample.map(h => h.N);
  errChart.data.datasets[0].data = sample.map(h => h.piEst);
  errChart.data.datasets[1].data = sample.map(() => PI);
  errChart.update('none');
}

function collatz(n) {
  // 返回完整序列
  const out = [n];
  while (n !== 1) {
    n = (n % 2 === 0) ? n / 2 : 3 * n + 1;
    out.push(n);
  }
  return out;
}

function collatzUpTo(n, stepLimit = 10000) {
  // 单步版
  let steps = 0;
  let max = n;
  const start = n;
  while (n !== 1 && steps < stepLimit) {
    n = (n % 2 === 0) ? n / 2 : 3 * n + 1;
    steps++;
    if (n > max) max = n;
  }
  return { start, steps, max, done: n === 1, final: n };
}

/* ===================== Pythagorean ===================== */
function gcd(a, b) { return b === 0 ? a : gcd(b, a % b); }
function isPrimitive(m, n) {
  return (m - n) % 2 === 1 && gcd(m, n) === 1;
}
function buildPrimitives(maxC = 1000) {
  const out = [];
  for (let m = 2; m <= 40; m++) {
    for (let n = 1; n < m; n++) {
      if (!isPrimitive(m, n)) continue;
      const a = m*m - n*n;
      const b = 2*m*n;
      const c = m*m + n*n;
      if (c > maxC) continue;
      const triple = [Math.min(a, b), Math.max(a, b), c].sort((x,y)=>x-y);
      out.push({ m, n, a: triple[0], b: triple[1], c: triple[2] });
    }
  }
  return out;
}
const ALL_PY = buildPrimitives(1000);

function pyContains(triple, digit) {
  return triple.a.toString().includes(digit.toString())
      || triple.b.toString().includes(digit.toString())
      || triple.c.toString().includes(digit.toString());
}

function pyCheck(qText, t) {
  if (qText === 'allOdd') {
    const odd = (t.a % 2 === 1) && (t.b % 2 === 1) && (t.c % 2 === 1);
    return { pass: odd, label: '三边都奇？' };
  }
  if (qText === 'hasEven') {
    const even = [t.a, t.b, t.c].some(x => x % 2 === 0);
    return { pass: even, label: '有偶数边？' };
  }
  return null;
}

function pyValidateInput(mode, val) {
  if (mode === 'allOdd' || mode === 'hasEven') return null;
  if (val === '' || val === null || val === undefined) return '请先输入数字';
  const n = Number(val);
  if (!Number.isInteger(n) || isNaN(n)) return '请输入合法整数';
  if (mode === 'contains') {
    if (n < 0 || n > 9) return '包含数字问题：请输入 0-9 的单个数字';
  } else if (mode === 'maxLess') {
    if (n < 3) return '最大边至少要 ≥ 3（最小勾股数 3-4-5）';
    if (n > 10000) return '最大边请 ≤ 10000（避免候选全空）';
  } else if (mode === 'mEq') {
    if (n < 2 || n > 40) return 'm 取值范围 2-40（公式约束）';
  } else if (mode === 'nEq') {
    if (n < 1 || n > 39) return 'n 取值范围 1-39（公式约束）';
  }
  return null;
}

function pyAsk() {
  if (!pyTarget) { pyReset(); return; }
  const mode = pyQEl.dataset.mode || 'contains';
  let val = pyQEl.value.trim();
  const err = pyValidateInput(mode, val);
  if (err) { alert(err); return; }

  const qKey = `${mode}:${val}`;
  if (pyLastQ === qKey) { alert('同一个问题不要重复提～'); return; }

  let result;
  if (mode === 'contains') {
    const target = pyContains(pyTarget, val);
    result = { pass: target, label: `包含数字 ${val}？` };
  } else if (mode === 'maxLess') {
    const target = pyTarget.c < +val;
    result = { pass: target, label: `最大边 < ${val}？` };
  } else if (mode === 'mEq') {
    const target = pyTarget.m === +val;
    result = { pass: target, label: `m = ${val}？` };
  } else if (mode === 'nEq') {
    const target = pyTarget.n === +val;
    result = { pass: target, label: `n = ${val}？` };
  } else {
    result = pyCheck(mode, pyTarget);
  }

  const beforeFilter = pyRemain.slice();
  pyRemain = pyRemain.filter(t => {
    if (mode === 'contains') return pyContains(t, val) === result.pass;
    if (mode === 'maxLess') return (t.c < +val) === result.pass;
    if (mode === 'mEq') return (t.m === +val) === result.pass;
    if (mode === 'nEq') return (t.n === +val) === result.pass;
    if (mode === 'allOdd') return ((t.a%2===1) && (t.b%2===1) && (t.c%2===1)) === result.pass;
    if (mode === 'hasEven') return [t.a,t.b,t.c].some(x => x%2===0) === result.pass;
    return true;
  });

  if (pyRemain.length === 0) {
    pyRemain = beforeFilter;
    alert('这次提问会把所有候选都排除——已自动撤销。\n试试换个数字或换个问题类型。');
    return;
  }

  pyLastQ = qKey;
  const sign = result.pass ? '✓ 是' : '✗ 否';
  const color = result.pass ? 'var(--good)' : 'var(--warn)';
  const newLog = pyLogEl.innerHTML === '（还没有提问）' ? '' : pyLogEl.innerHTML + '<br>';
  pyLogEl.innerHTML = newLog + `<span style="color: ${color};">${sign}</span> ${result.label}`;

  pyUsed++;
  pyUpdateUI();

  if (pyRemain.length === 1) {
    pyAnswerEl.innerHTML = `✓ 候选只剩 1 个：<strong>(${pyRemain[0].a}, ${pyRemain[0].b}, ${pyRemain[0].c})</strong>　<span style="color: var(--muted);">用 ${pyUsed} 步猜中</span>`;
    pyAnswerEl.style.background = '#ecfdf5';
    pyAnswerEl.style.color = '#065f46';
  }
  pyQEl.value = '';
}

function updateFactory() {
  let m = +mSlider.value;
  let n = +nSlider.value;
  if (n >= m) { n = m - 1; nSlider.value = n; }
  mVal.textContent = m;
  nVal.textContent = n;
  const a = m*m - n*n;
  const b = 2*m*n;
  const c = m*m + n*n;
  const sorted = [a, b, c].sort((x,y) => x - y);
  aOut.textContent = sorted[0];
  bOut.textContent = sorted[1];
  cOut.textContent = sorted[2];
  const prim = isPrimitive(m, n);
  if (prim) {
    pyCheckEl.innerHTML = `✓ 是本原（gcd=1, m−n 奇 = ${m-n}）`;
    pyCheckEl.style.color = '#059669';
  } else {
    const reason = (m-n) % 2 === 0 ? 'm−n 是偶数' : `gcd(m,n)=${gcd(m,n)}`;
    pyCheckEl.innerHTML = `✗ 非本原（${reason}）—— 答案会被缩放`;
    pyCheckEl.style.color = '#dc2626';
  }
}

  } else {

function fcVoroGenerate(n) {
  const seeds = [];
  const W = FC_CANVAS, H = FC_CANVAS;
  let attempts = 0;
  while (seeds.length < n && attempts < 200) {
    attempts++;
    const p = { x: 30 + Math.random() * (W - 60), y: 30 + Math.random() * (H - 60) };
    let ok = true;
    for (const s of seeds) {
      const d = Math.hypot(p.x - s.x, p.y - s.y);
      if (d < 50) { ok = false; break; }
    }
    if (ok) { p.id = seeds.length; seeds.push(p); }
  }
  fcVoroSeeds = seeds;
  const cellSize = FC_VORO_CELL;
  fcRows = Math.floor(H / cellSize);
  fcCols = Math.floor(W / cellSize);
  fcCellPx = cellSize;
  fcVoroRegion = Array.from({ length: fcRows }, () => Array(fcCols).fill(0));
  fcGrid = Array.from({ length: fcRows }, () => Array(fcCols).fill(0));
  for (let y = 0; y < fcRows; y++) {
    for (let x = 0; x < fcCols; x++) {
      const px = x * cellSize + cellSize / 2;
      const py = y * cellSize + cellSize / 2;
      let minD = Infinity, minId = 0;
      for (const s of seeds) {
        const d = (px - s.x) ** 2 + (py - s.y) ** 2;
        if (d < minD) { minD = d; minId = s.id; }
      }
      fcVoroRegion[y][x] = minId;
    }
  }
}

        rect.style.cursor = 'pointer';
        rect.onclick = () => fcClick(r, c);
        rect.addEventListener('touchstart', (e) => { e.preventDefault(); fcClick(r, c); }, { passive: false });
        fcSvg.appendChild(rect);
        if (v > 0) {
          const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
          text.setAttribute('x', x + FC_GRID_CELL / 2); text.setAttribute('y', y + FC_GRID_CELL / 2 + 5);
          text.setAttribute('text-anchor', 'middle'); text.setAttribute('fill', FC_COLORS[v-1].hex);
          text.setAttribute('font-size', 22); text.setAttribute('font-weight', 700);
          text.textContent = v; text.style.pointerEvents = 'none';
          fcSvg.appendChild(text);
        }
      }
    }
  } else {
    for (let y = 0; y < fcRows; y++) {
      for (let x = 0; x < fcCols; x++) {
        const v = fcGrid[y][x];
        const reg = fcVoroRegion[y][x];
        const baseColor = v === 0 ? FC_REGION_COLORS[reg % FC_REGION_COLORS.length] : FC_COLORS[v-1].hex;
        const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        rect.setAttribute('x', x * fcCellPx); rect.setAttribute('y', y * fcCellPx);
        rect.setAttribute('width', fcCellPx); rect.setAttribute('height', fcCellPx);
        rect.setAttribute('fill', baseColor); rect.style.cursor = 'pointer';
        rect.onclick = () => fcClick(y, x);
        rect.addEventListener('touchstart', (e) => { e.preventDefault(); fcClick(y, x); }, { passive: false });
        fcSvg.appendChild(rect);
      }
    }
    for (let y = 0; y < fcRows; y++) {
      for (let x = 0; x < fcCols; x++) {
        const reg = fcVoroRegion[y][x];
        if (x + 1 < fcCols && fcVoroRegion[y][x+1] !== reg) {
          const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
          line.setAttribute('x1', (x + 1) * fcCellPx); line.setAttribute('y1', y * fcCellPx);
          line.setAttribute('x2', (x + 1) * fcCellPx); line.setAttribute('y2', (y + 1) * fcCellPx);
          line.setAttribute('stroke', '#1f2937'); line.setAttribute('stroke-width', 1.2);
          line.setAttribute('opacity', 0.3); line.style.pointerEvents = 'none';
          fcSvg.appendChild(line);
        }
        if (y + 1 < fcRows && fcVoroRegion[y+1][x] !== reg) {
          const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
          line.setAttribute('x1', x * fcCellPx); line.setAttribute('y1', (y + 1) * fcCellPx);
          line.setAttribute('x2', (x + 1) * fcCellPx); line.setAttribute('y2', (y + 1) * fcCellPx);
          line.setAttribute('stroke', '#1f2937'); line.setAttribute('stroke-width', 1.2);
          line.setAttribute('opacity', 0.3); line.style.pointerEvents = 'none';
          fcSvg.appendChild(line);
        }
      }
    }
    const centers = fcVoroSeeds.map(s => ({ x: s.x, y: s.y, id: s.id, count: 0, sumX: 0, sumY: 0 }));
    for (let y = 0; y < fcRows; y++) {
      for (let x = 0; x < fcCols; x++) {
        const r = fcVoroRegion[y][x];
        centers[r].sumX += x * fcCellPx + fcCellPx / 2;
        centers[r].sumY += y * fcCellPx + fcCellPx / 2;
        centers[r].count++;
      }
    }
    centers.forEach((c) => {
      if (c.count === 0) return;
      const cx = c.sumX / c.count;
      const cy = c.sumY / c.count;
      const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      text.setAttribute('x', cx); text.setAttribute('y', cy + 4);
      text.setAttribute('text-anchor', 'middle'); text.setAttribute('fill', '#1f2937');
      text.setAttribute('font-size', 11); text.setAttribute('font-weight', 700);
      text.setAttribute('opacity', 0.6); text.textContent = c.id + 1;
      text.style.pointerEvents = 'none';
      fcSvg.appendChild(text);
    });
  }
}

function fcClick(r, c) {
  if (fcThreeOnly && fcCurrent === 4) return;
  fcGrid[r][c] = fcGrid[r][c] === fcCurrent ? 0 : fcCurrent;
  fcRenderGrid();
  fcUpdateStats();
}

function fcUpdateStats() {
  let filled = 0, conflicts = 0, used = new Set();
  for (let r = 0; r < fcRows; r++) {
    for (let c = 0; c < fcCols; c++) {
      const v = fcGrid[r][c];
      if (v === 0) continue;
      filled++;
      used.add(v);
      if (c + 1 < fcCols && fcGrid[r][c+1] === v) conflicts++;
      if (r + 1 < fcRows && fcGrid[r+1][c] === v) conflicts++;
    }
  }
  const regionFilled = new Set();
  if (fcMapType === 'voro') {
    for (let r = 0; r < fcRows; r++) {
      for (let c = 0; c < fcCols; c++) {
        if (fcGrid[r][c] !== 0) regionFilled.add(fcVoroRegion[r][c]);
      }
    }
  } else {
    regionFilled.size = filled;
  }
  fcFilledEl.textContent = fcMapType === 'voro' ? regionFilled.size : filled;
  fcConflictEl.textContent = conflicts;
  fcColorsEl.textContent = used.size;
  if (filled === 0) {
    fcVerdictEl.textContent = '—';
    fcVerdictEl.style.color = '';
  } else if (conflicts === 0) {
    const need = fcMapType === 'voro' ? regionFilled.size : filled;
    const total = fcMapType === 'voro' ? fcVoroSeeds.length : FC_GRID_SIZE * FC_GRID_SIZE;
    if (need < total) {
      fcVerdictEl.textContent = `✓ 无冲突（${need}/${total}）`;
      fcVerdictEl.style.color = 'var(--good)';
    } else {
      fcVerdictEl.textContent = `✓ 完成！用了 ${used.size} 种颜色`;
      fcVerdictEl.style.color = 'var(--good)';
    }
  } else {
    fcVerdictEl.textContent = `✗ ${conflicts} 处冲突`;
    fcVerdictEl.style.color = 'var(--warn)';
  }
}

function fcAuto4Color() {
  const g = fcGrid.map(row => row.slice());
  const isOK = (r, c, v) => {
    if (c > 0 && g[r][c-1] === v) return false;
    if (r > 0 && g[r-1][c] === v) return false;
    return true;
  };
  for (let pass = 0; pass < 4; pass++) {
    let changed = false;
    for (let r = 0; r < fcRows; r++) {
      for (let c = 0; c < fcCols; c++) {
        if (g[r][c] !== 0) continue;
        for (let v = 1; v <= 4; v++) {
          if (isOK(r, c, v)) { g[r][c] = v; changed = true; break; }
        }
      }
    }
    if (!changed) break;
  }
  for (let r = 0; r < fcRows; r++) {
    for (let c = 0; c < fcCols; c++) {
      if (g[r][c] === 0) g[r][c] = 1;
    }
  }
  fcGrid = g;
  fcRenderGrid();
  fcUpdateStats();
}

function setupRamsey(root) {

            const a = edges[i*5 - i*(i-1)/2 + (j-i-1)];
            const b = edges[j*5 - j*(j-1)/2 + (k-j-1)];
            const c = edges[i*5 - i*(i-1)/2 + (k-i-1)];

function rmPos() {
  const cx = 240, cy = 210, R = 140;
  rmPoints = [];
  for (let i = 0; i < RM_N; i++) {
    const a = -Math.PI / 2 + i * 2 * Math.PI / RM_N;
    rmPoints.push({ x: cx + R * Math.cos(a), y: cy + R * Math.sin(a), i });
  }
}

function rmEdgeIdx(i, j) {
  if (i > j) [i, j] = [j, i];
  return i * (RM_N - 1) - i * (i - 1) / 2 + (j - i - 1);
}

function rmRender() {
  rmPos();
  rmSvg.innerHTML = '';
  const tri = rmFindTriangles();
  tri.forEach(([a, b, c]) => {
    [[a,b],[b,c],[c,a]].forEach(([i, j]) => {
      const p1 = rmPoints[i], p2 = rmPoints[j];
      const hl = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      hl.setAttribute('x1', p1.x); hl.setAttribute('y1', p1.y);
      hl.setAttribute('x2', p2.x); hl.setAttribute('y2', p2.y);
      hl.setAttribute('stroke', '#fbbf24'); hl.setAttribute('stroke-width', 8);
      hl.setAttribute('opacity', 0.6); hl.setAttribute('stroke-linecap', 'round');
      rmSvg.appendChild(hl);
    });
  });
  for (let i = 0; i < RM_N; i++) {
    for (let j = i+1; j < RM_N; j++) {
      const idx = rmEdgeIdx(i, j);
      const red = rmEdges[idx];
      const p1 = rmPoints[i], p2 = rmPoints[j];
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', p1.x); line.setAttribute('y1', p1.y);
      line.setAttribute('x2', p2.x); line.setAttribute('y2', p2.y);
      line.setAttribute('stroke', red === null ? '#9ca3af' : (red ? '#ef4444' : '#2563eb'));
      line.setAttribute('stroke-width', red === null ? 1 : 2.5);
      line.setAttribute('stroke-dasharray', red === null ? '4 4' : '0');
      line.style.cursor = 'pointer';
      line.onclick = () => {
        if (rmEdges[idx] === null) rmEdges[idx] = true;
        else if (rmEdges[idx] === true) rmEdges[idx] = false;
        else rmEdges[idx] = null;
        rmRender();
        rmUpdateStats();
      };
      rmSvg.appendChild(line);
    }
  }
  rmPoints.forEach((p, idx) => {
    const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    c.setAttribute('cx', p.x); c.setAttribute('cy', p.y); c.setAttribute('r', 22);
    c.setAttribute('fill', '#fff'); c.setAttribute('stroke', '#1f2937'); c.setAttribute('stroke-width', 2);
    rmSvg.appendChild(c);
    const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    t.setAttribute('x', p.x); t.setAttribute('y', p.y + 5);
    t.setAttribute('text-anchor', 'middle'); t.setAttribute('font-size', 16); t.setAttribute('font-weight', 700);
    t.textContent = idx + 1; t.style.pointerEvents = 'none';
    rmSvg.appendChild(t);
  });
}

function rmFindTriangles() {
  const tris = [];
  for (let i = 0; i < RM_N; i++) {
    for (let j = i+1; j < RM_N; j++) {
      for (let k = j+1; k < RM_N; k++) {
        const a = rmEdges[rmEdgeIdx(i, j)];
        const b = rmEdges[rmEdgeIdx(j, k)];
        const c = rmEdges[rmEdgeIdx(i, k)];
        if (a !== null && a === b && a === c) tris.push([i, j, k]);
      }
    }
  }
  return tris;
}

function rmUpdateStats() {
  let red = 0, blue = 0;
  for (const e of rmEdges) {
    if (e === true) red++;
    else if (e === false) blue++;
  }
  rmRedEl.textContent = red;
  rmBlueEl.textContent = blue;
  const tri = rmFindTriangles();
  rmTriEl.textContent = tri.length;
  rmTriEl.style.color = tri.length > 0 ? '#059669' : '';
}

function rmRandomFill(pRed = 0.5, forceAll = true) {
  rmEdges = Array(RM_N * (RM_N - 1) / 2).fill(null);
  for (let idx = 0; idx < rmEdges.length; idx++) {
    if (forceAll || Math.random() < 0.9) {
      rmEdges[idx] = Math.random() < pRed;
    }
  }
  rmRender();
  rmUpdateStats();
}

function rmK5NoMono() {
  rmEdges = Array(RM_N * (RM_N - 1) / 2).fill(null);
  for (let j = 0; j < RM_N; j++) {
    if (j !== 5) rmEdges[rmEdgeIdx(5, j)] = false;
  }
  const ring = [0, 1, 2, 3, 4];
  for (let i = 0; i < 5; i++) {
    const a = ring[i], b = ring[(i+1) % 5];
    rmEdges[rmEdgeIdx(a, b)] = true;
  }
  for (let i = 0; i < 5; i++) {
    for (let j = i+2; j < 5; j++) {
      const a = ring[i], b = ring[j];
      if (rmEdges[rmEdgeIdx(a, b)] === null) {
        rmEdges[rmEdgeIdx(a, b)] = false;
      }
    }
  }
  rmRender();
  rmUpdateStats();
}

function sieve(n) {
  const isPrime = new Uint8Array(n + 1).fill(1);
  isPrime[0] = isPrime[1] = 0;
  for (let i = 2; i * i <= n; i++) {
    if (isPrime[i]) {
      for (let j = i * i; j <= n; j += i) isPrime[j] = 0;
    }
  }
  return isPrime;
}

function gbDecompose(N, isPrime) {
  const pairs = [];
  for (let p = 2; p <= N/2; p++) {
    if (isPrime[p] && isPrime[N - p]) {
      pairs.push([p, N - p]);
    }
  }
  return pairs;
}

function gbFindPairs() {
  const N = +gbN.value;
  if (N < 4 || N % 2 !== 0) {
    alert('请输入 ≥ 4 的偶数');
    return;
  }
  if (N > 100000) {
    alert('为避免卡顿，请输入 ≤ 100000 的偶数');
    return;
  }
  const isPrime = sieve(N);
  const pairs = gbDecompose(N, isPrime);
  if (pairs.length === 0) {
    gbList.innerHTML = `<em style="color: var(--warn);">N = ${N} 没找到配对（这本身就是反例！）</em>`;
    gbCountEl.textContent = '0';
    gbVerdictEl.textContent = '✗ 反例！';
    gbVerdictEl.style.color = 'var(--warn)';
  } else {
    gbList.innerHTML = pairs.map(([a, b]) =>
      `<strong style="color: var(--accent);">${a} + ${b} = ${N}</strong>`
    ).join('　');
    gbCountEl.textContent = pairs.length;
    gbVerdictEl.textContent = '✓ 配成';
    gbVerdictEl.style.color = 'var(--good)';
  }
}

function gbScan() {
  const N = +gbScanN.value;
  if (N < 10 || N > 50000) {
    alert('扫描范围 10 ≤ N ≤ 50000');
    return;
  }
  const isPrime = sieve(N);
  let total = 0, ok = 0, failList = [];
  for (let n = 4; n <= N; n += 2) {
    total++;
    let found = false;
    for (let p = 2; p <= n/2; p++) {
      if (isPrime[p] && isPrime[n - p]) { found = true; break; }
    }
    if (found) ok++;
    else failList.push(n);
  }
  gbTotalEl.textContent = total;
  gbOkEl.textContent = `${ok} (${(ok/total*100).toFixed(2)}%)`;
  gbOkEl.style.color = ok === total ? 'var(--good)' : 'var(--warn)';
  if (failList.length > 0) {
    alert(`找到反例！N = ${failList.join(', ')}`);
  }
}

function initStage_PR01_s2() {
  const svg = document.getElementById('pr01s2-svg');
  const angleSlider = document.getElementById('pr01s2-angle');
  const avEl = document.getElementById('pr01s2-av');
  const statusEl = document.getElementById('pr01s2-status');
  const linesG = document.getElementById('pr01s2-lines');
  const dangerG = document.getElementById('pr01s2-danger');
  const needle = document.getElementById('pr01s2-needle');
  const center = document.getElementById('pr01s2-center');
  if (!svg) return;
  // 画 2 条平行线（间距 60），针长 80
  const W = 240, H = 180, L = 80, d = 60;
  let centerX = 120, centerY = 60; // 针中心（可拖动）
  linesG.innerHTML = '';
  for (let y = d; y < H; y += d) {
    const ln = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    ln.setAttribute('x1', 0); ln.setAttribute('y1', y);
    ln.setAttribute('x2', W); ln.setAttribute('y2', y);
    ln.setAttribute('stroke', '#9ca3af');
    ln.setAttribute('stroke-width', '1.5');
    ln.setAttribute('stroke-dasharray', '5 4');
    linesG.appendChild(ln);
  }
  // 危险区：每条线两侧 L/2 宽的区域（粉色高亮），提醒孩子"针中心在这区域就可能跨线"
  const updateDanger = () => {
    dangerG.innerHTML = '';
    const halfL = L / 2;
    for (let y = d; y < H; y += d) {
      const r1 = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      r1.setAttribute('x', 0); r1.setAttribute('y', Math.max(0, y - halfL));
      r1.setAttribute('width', W); r1.setAttribute('height', halfL);
      r1.setAttribute('fill', '#fecaca'); r1.setAttribute('opacity', '0.35');
      dangerG.appendChild(r1);
      const r2 = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      r2.setAttribute('x', 0); r2.setAttribute('y', y);
      r2.setAttribute('width', W); r2.setAttribute('height', halfL);
      r2.setAttribute('fill', '#fecaca'); r2.setAttribute('opacity', '0.35');
      dangerG.appendChild(r2);
    }
  };
  updateDanger();
  const update = () => {
    const deg = +angleSlider.value;
    avEl.textContent = deg + '°';
    const rad = deg * Math.PI / 180;
    const hx = (L/2) * Math.cos(rad);
    const hy = (L/2) * Math.sin(rad);
    needle.setAttribute('x1', centerX - hx); needle.setAttribute('y1', centerY + hy);
    needle.setAttribute('x2', centerX + hx); needle.setAttribute('y2', centerY - hy);
    center.setAttribute('cx', centerX); center.setAttribute('cy', centerY);
    // 跨线判定
    const y1 = centerY + hy, y2 = centerY - hy;
    const lineY1 = Math.floor(y1 / d) * d;
    const lineY2 = Math.floor(y2 / d) * d;
    const hit = (lineY1 !== lineY2);
    if (hit) {
      statusEl.textContent = '跨线 ✓';
      statusEl.style.background = '#10b981';
      needle.setAttribute('stroke', '#10b981');
      center.setAttribute('fill', '#10b981');
    } else {
      statusEl.textContent = '不跨线 ✗';
      statusEl.style.background = '#6b7280';
      needle.setAttribute('stroke', '#1e40af');
      center.setAttribute('fill', '#1e40af');
    }
  };
  angleSlider.oninput = update;
  // ====== 鼠标拖拽 ======
  let dragging = false;
  const svgPt = (clientX, clientY) => {
    const rect = svg.getBoundingClientRect();
    const sx = (clientX - rect.left) * (W / rect.width);
    const sy = (clientY - rect.top) * (H / rect.height);
    return { x: sx, y: sy };
  };
  const startDrag = (clientX, clientY) => {
    const p = svgPt(clientX, clientY);
    // 点击点距中心 < 20 才算抓住
    if (Math.hypot(p.x - centerX, p.y - centerY) < 20) {
      dragging = true;
      svg.style.cursor = 'grabbing';
      needle.style.cursor = 'grabbing';
      center.style.cursor = 'grabbing';
    }
  };
  const moveDrag = (clientX, clientY) => {
    if (!dragging) return;
    const p = svgPt(clientX, clientY);
    // 限制中心在画布内（针不超出）
    const halfL = L / 2;
    centerX = Math.max(halfL, Math.min(W - halfL, p.x));
    centerY = Math.max(halfL, Math.min(H - halfL, p.y));
    update();
  };
  const endDrag = () => {
    if (dragging) {
      dragging = false;
      svg.style.cursor = 'grab';
      needle.style.cursor = 'grab';
      center.style.cursor = 'grab';
    }
  };
  svg.addEventListener('mousedown', (e) => { e.preventDefault(); startDrag(e.clientX, e.clientY); });
  svg.addEventListener('touchstart', (e) => { e.preventDefault(); const t = e.touches[0]; startDrag(t.clientX, t.clientY); }, { passive: false });
  window.addEventListener('mousemove', (e) => moveDrag(e.clientX, e.clientY));
  window.addEventListener('touchmove', (e) => { if (dragging) { e.preventDefault(); const t = e.touches[0]; moveDrag(t.clientX, t.clientY); } }, { passive: false });
  window.addEventListener('mouseup', endDrag);
  window.addEventListener('touchend', endDrag);
  update();
}

    ctx.clearRect(0, 0, W, H);
    ctx.strokeStyle = '#9ca3af'; ctx.lineWidth = 1; ctx.setLineDash([5, 4]);
    for (let y = d; y < H; y += d) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
    ctx.setLineDash([]);
  };
  const drawNeedle = (n, animT) => {
    // animT: 0=针从天上落下来, 1=针完全到位
    ctx.strokeStyle = n.hit ? '#10b981' : '#ef4444';
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    const fall = (1 - animT) * 50; // 落下偏移 50px
    const opacity = 0.3 + 0.7 * animT;
    ctx.globalAlpha = opacity;
    // 针从天上落下：用两点间 lerp，y 偏移 fall
    const startX = n.x - n.hx, startY = n.y + n.hy - fall;
    const endX = n.x + n.hx, endY = n.y - n.hy - fall;
    ctx.beginPath();
    ctx.moveTo(startX, startY);
    ctx.lineTo(endX, endY);
    ctx.stroke();
    ctx.globalAlpha = 1;
  };
  const drawAllExisting = () => {
    for (const nd of needles) {
      ctx.strokeStyle = nd.hit ? '#10b981' : '#ef4444';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(nd.x - nd.hx, nd.y + nd.hy);
      ctx.lineTo(nd.x + nd.hx, nd.y - nd.hy);
      ctx.stroke();
    }
  };
  const updateStats = () => {
    const N = needles.length;
    const n = needles.filter(x => x.hit).length;
    NEl.textContent = N; nEl.textContent = n;
    if (N === 0) { PEl.textContent = '—'; return; }
    PEl.textContent = (n / N * 100).toFixed(1) + '%';
  };
  // 生成 N 根针的随机数据
  const genN = (cnt) => {
    const out = [];
    for (let i = 0; i < cnt; i++) {
      const x = Math.random() * W;
      const y = d/2 + Math.random() * (H - d);
      const angle = Math.random() * Math.PI;
      const hx = (L/2) * Math.cos(angle);
      const hy = (L/2) * Math.sin(angle);
      const y1 = y + hy, y2 = y - hy;
      const hit = Math.floor(y1 / d) * d !== Math.floor(y2 / d) * d;
      out.push({ x, y, hx, hy, hit });
    }
    return out;
  };
  // 逐根落下动画
  const startDrop = (cnt, interval) => {
    if (dropping) return;
    dropQueue = genN(cnt);
    dropping = true;
    dropBtn.disabled = true;
    dropBtn.textContent = '⏳ 正在撒针...';
    let i = 0;
    const step = () => {
      if (i >= dropQueue.length) {
        dropping = false;
        dropBtn.disabled = false;
        dropBtn.textContent = '🎲 再撒 100 根';
        drawLines();
        drawAllExisting();
        updateStats();
        return;
      }
      const nd = dropQueue[i];
      needles.push(nd);
      drawLines();
      drawAllExisting();
      // 当前这根做落下动画
      const t0 = performance.now();
      const dur = 180;
      const anim = (now) => {
        const t = Math.min(1, (now - t0) / dur);
        drawLines();
        drawAllExisting();
        drawNeedle(nd, t);
        if (t < 1) requestAnimationFrame(anim);
      };
      requestAnimationFrame(anim);
      updateStats();
      i++;
      dropTimer = setTimeout(step, interval);
    };
    step();
  };
  dropBtn.onclick = () => startDrop(100, 25);
  resetBtn.onclick = () => {
    if (dropTimer) { clearTimeout(dropTimer); dropTimer = null; }
    dropping = false;
    dropBtn.disabled = false;
    dropBtn.textContent = '🎲 撒 100 根针';
    needles = []; dropQueue = [];
    drawLines();
    updateStats();
  };
  drawLines();
  updateStats();
}

function initStage_PR01_s4() {
  const svg = document.getElementById('pr01s4-svg');
  const angleSlider = document.getElementById('pr01s4-angle');
  const ySlider = document.getElementById('pr01s4-y');
  const avEl = document.getElementById('pr01s4-av');
  const yvEl = document.getElementById('pr01s4-yv');
  const linesG = document.getElementById('pr01s4-lines');
  const needle = document.getElementById('pr01s4-needle');
  const center = document.getElementById('pr01s4-center');
  const ybar = document.getElementById('pr01s4-ybar');
  const proj = document.getElementById('pr01s4-proj');
  const projLbl = document.getElementById('pr01s4-projlbl');
  const arrow = document.getElementById('pr01s4-arrow');
  const comparetxt = document.getElementById('pr01s4-comparetxt');
  const barProj = document.getElementById('pr01s4-bar-proj');
  const barProjLbl = document.getElementById('pr01s4-bar-proj-lbl');
  const barY = document.getElementById('pr01s4-bar-y');
  const barYLbl = document.getElementById('pr01s4-bar-y-lbl');
  const rulerticks = document.getElementById('pr01s4-rulerticks');
  const verdict = document.getElementById('pr01s4-verdict');
  if (!svg) return;
  const W = 220, H = 180, CX = 110, CY = 40, L = 100, d = 50;
  // 画平行线 + 刻度尺 ticks
  linesG.innerHTML = '';
  for (let y = d; y < H; y += d) {
    const ln = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    ln.setAttribute('x1', 0); ln.setAttribute('y1', y);
    ln.setAttribute('x2', W); ln.setAttribute('y2', y);
    ln.setAttribute('stroke', '#9ca3af');
    ln.setAttribute('stroke-width', '1.5');
    ln.setAttribute('stroke-dasharray', '5 4');
    linesG.appendChild(ln);
  }
  // 尺子刻度（0-50）
  rulerticks.innerHTML = '';
  for (let v = 0; v <= 50; v += 10) {
    const x = 20 + v * 4.8; // 240/50 = 4.8
    const t = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    t.setAttribute('x1', x); t.setAttribute('y1', 36);
    t.setAttribute('x2', x); t.setAttribute('y2', 44);
    t.setAttribute('stroke', '#9ca3af'); t.setAttribute('stroke-width', '1');
    rulerticks.appendChild(t);
    const lbl = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    lbl.setAttribute('x', x); lbl.setAttribute('y', 56);
    lbl.setAttribute('text-anchor', 'middle');
    lbl.setAttribute('font-size', '8'); lbl.setAttribute('fill', '#9ca3af');
    lbl.textContent = v;
    rulerticks.appendChild(lbl);
  }
  const update = () => {
    const deg = +angleSlider.value;
    const y = +ySlider.value;
    avEl.textContent = deg + '°';
    yvEl.textContent = y;
    const rad = deg * Math.PI / 180;
    const Lsin = (L/2) * Math.sin(rad); // 紫色：针的垂直伸长
    // 画针
    const hx = (L/2) * Math.cos(rad);
    const hy = (L/2) * Math.sin(rad);
    const centerX = CX, centerY = CY;
    needle.setAttribute('x1', centerX - hx); needle.setAttribute('y1', centerY + hy);
    needle.setAttribute('x2', centerX + hx); needle.setAttribute('y2', centerY - hy);
    center.setAttribute('cx', centerX); center.setAttribute('cy', centerY);
    // 紫色虚线：标出"垂直伸长 = (L/2) sin θ"
    const topX = centerX + hx, topY = centerY - hy;
    const bottomX = centerX - hx, bottomY = centerY + hy;
    const midX = (topX + bottomX) / 2, midY = (topY + bottomY) / 2;
    // 从中点往垂直方向画 Lsin 长度（向上）
    proj.setAttribute('x1', midX); proj.setAttribute('y1', midY);
    proj.setAttribute('x2', midX); proj.setAttribute('y2', midY - Lsin);
    projLbl.setAttribute('x', midX + 4); projLbl.setAttribute('y', midY - Lsin / 2);
    projLbl.textContent = `投影 ${Lsin.toFixed(1)}`;
    // 红色 y 距离线（从中心到最近线，向下）
    ybar.setAttribute('x1', centerX + 25); ybar.setAttribute('y1', centerY);
    ybar.setAttribute('x2', centerX + 25); ybar.setAttribute('y2', centerY + y);
    // 尺子：紫色条 = 投影 Lsin，红色条 = 距离 y
    const rulerMax = 50, rulerLen = 240;
    const pxWidth = Math.min(Lsin, rulerMax) * (rulerLen / rulerMax);
    const pyWidth = Math.min(y, rulerMax) * (rulerLen / rulerMax);
    barProj.setAttribute('width', pxWidth);
    barProjLbl.setAttribute('x', 20 + pxWidth + 4);
    barProjLbl.textContent = `投影 ${Lsin.toFixed(1)}`;
    barY.setAttribute('width', pyWidth);
    barYLbl.setAttribute('x', 20 + pyWidth + 4);
    barYLbl.textContent = `距离 ${y.toFixed(0)}`;
    // 比较 + 判定
    const hit = (Lsin > y);
    if (hit) {
      arrow.textContent = '▶'; arrow.style.color = '#10b981';
      comparetxt.innerHTML = '投影 &gt; 距离';
      needle.setAttribute('stroke', '#10b981');
      center.setAttribute('fill', '#10b981');
      verdict.style.background = '#dcfce7';
      verdict.style.color = '#15803d';
      verdict.innerHTML = '✅ 投影 &gt; 距离 → <strong>跨线！</strong>';
    } else {
      arrow.textContent = '◀'; arrow.style.color = '#ef4444';
      comparetxt.innerHTML = '投影 &lt; 距离';
      needle.setAttribute('stroke', '#7c3aed');
      center.setAttribute('fill', '#7c3aed');
      verdict.style.background = '#fee2e2';
      verdict.style.color = '#b91c1c';
      verdict.innerHTML = '❌ 投影 &lt; 距离 → <strong>不跨线</strong>';
    }
  };
  angleSlider.oninput = update;
  ySlider.oninput = update;
  update();
}

let _pr01s5_needles = [];
let _pr01s5_chart = null;
function initStage_PR01_s5() {
  const cv = document.getElementById('pr01s5-cv');
  const chartCv = document.getElementById('pr01s5-chart');
  if (!cv) return;
  const ctx = cv.getContext('2d');
  const b100 = document.getElementById('pr01s5-100');
  const b1000 = document.getElementById('pr01s5-1000');
  const resetBtn = document.getElementById('pr01s5-reset');
  const NEl = document.getElementById('pr01s5-N');
  const nEl = document.getElementById('pr01s5-n');
  const piEl = document.getElementById('pr01s5-pi');
  const W = cv.width, H = cv.height;
  const L = 60, d = 50;
  let history = [];
  let dropQueue = [];
  let dropTimer = null;
  let dropping = false;
  if (_pr01s5_chart) { try { _pr01s5_chart.destroy(); } catch(e){} _pr01s5_chart = null; }
  _pr01s5_chart = new Chart(chartCv.getContext('2d'), {
    type: 'line',
    data: {
      labels: [],
      datasets: [
        { label: 'π 估值', data: [], borderColor: '#ec4899', borderWidth: 2, pointRadius: 0, tension: 0.1 },
        { label: '真实 π', data: [], borderColor: '#9ca3af', borderWidth: 1.5, borderDash: [4, 4], pointRadius: 0 },
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: 'top', labels: { font: { size: 10 } } } },
      scales: { x: { display: false }, y: { suggestedMin: 2.5, suggestedMax: 3.8 } }
    }
  });
  const drawLines = () => {
    ctx.clearRect(0, 0, W, H);
    ctx.strokeStyle = '#e9d5ff'; ctx.lineWidth = 1; ctx.setLineDash([5, 4]);
    for (let y = d; y < H; y += d) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
    ctx.setLineDash([]);
  };
  const drawAllExisting = () => {
    for (const nd of _pr01s5_needles) {
      ctx.strokeStyle = nd.hit ? '#10b981' : '#ef4444';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(nd.x - nd.hx, nd.y + nd.hy);
      ctx.lineTo(nd.x + nd.hx, nd.y - nd.hy);
      ctx.stroke();
    }
  };
  const updateStats = () => {
    const N = _pr01s5_needles.length;
    const n = _pr01s5_needles.filter(x => x.hit).length;
    NEl.textContent = N; nEl.textContent = n;
    if (N === 0) { piEl.textContent = '—'; return; }
    const piEst = (2 * L * N) / (d * n);
    piEl.textContent = piEst.toFixed(3);
    history.push({ N, piEst });
    let sample = history;
    if (history.length > 100) {
      const step = Math.ceil(history.length / 100);
      sample = history.filter((_, i) => i % step === 0);
    }
    _pr01s5_chart.data.labels = sample.map(h => h.N);
    _pr01s5_chart.data.datasets[0].data = sample.map(h => h.piEst);
    _pr01s5_chart.data.datasets[1].data = sample.map(() => Math.PI);
    _pr01s5_chart.update('none');
  };
  const genN = (cnt) => {
    const out = [];
    for (let i = 0; i < cnt; i++) {
      const x = Math.random() * W;
      const y = d/2 + Math.random() * (H - d);
      const angle = Math.random() * Math.PI;
      const hx = (L/2) * Math.cos(angle);
      const hy = (L/2) * Math.sin(angle);
      const y1 = y + hy, y2 = y - hy;
      const hit = Math.floor(y1 / d) * d !== Math.floor(y2 / d) * d;
      out.push({ x, y, hx, hy, hit });
    }
    return out;
  };
  const startDrop = (cnt, interval) => {
    if (dropping) return;
    dropQueue = genN(cnt);
    dropping = true;
    b100.disabled = true;
    b1000.disabled = true;
    b100.textContent = '⏳ 撒针中...';
    let i = 0;
    const step = () => {
      if (i >= dropQueue.length) {
        dropping = false;
        b100.disabled = false;
        b1000.disabled = false;
        b100.textContent = '+ 100 根';
        b1000.textContent = '+ 1000 根';
        return;
      }
      const nd = dropQueue[i];
      _pr01s5_needles.push(nd);
      drawLines();
      drawAllExisting();
      const t0 = performance.now();
      const dur = 150;
      const anim = (now) => {
        const t = Math.min(1, (now - t0) / dur);
        drawLines();
        drawAllExisting();
        ctx.strokeStyle = nd.hit ? '#10b981' : '#ef4444';
        ctx.lineWidth = 1.5; ctx.lineCap = 'round';
        const fall = (1 - t) * 50;
        const opacity = 0.3 + 0.7 * t;
        ctx.globalAlpha = opacity;
        ctx.beginPath();
        ctx.moveTo(nd.x - nd.hx, nd.y + nd.hy - fall);
        ctx.lineTo(nd.x + nd.hx, nd.y - nd.hy - fall);
        ctx.stroke();
        ctx.globalAlpha = 1;
        if (t < 1) requestAnimationFrame(anim);
      };
      requestAnimationFrame(anim);
      updateStats();
      i++;
      dropTimer = setTimeout(step, interval);
    };
    step();
  };
  b100.onclick = () => startDrop(100, 20);
  b1000.onclick = () => startDrop(1000, 8);
  resetBtn.onclick = () => {
    if (dropTimer) { clearTimeout(dropTimer); dropTimer = null; }
    dropping = false;
    b100.disabled = false; b1000.disabled = false;
    b100.textContent = '+ 100 根'; b1000.textContent = '+ 1000 根';
    _pr01s5_needles = []; history = []; dropQueue = [];
    drawLines();
    updateStats();
  };
  drawLines();
  updateStats();
}

/* ===================== 5 步直观讲解：PR02 init ===================== */
function collatzSeq(n) {
  const out = [n];
  while (n !== 1) { n = (n % 2 === 0) ? n / 2 : 3 * n + 1; out.push(n); }
  return out;
}

function initStage_PR02_s1() {
  const nInput = document.getElementById('pr02s1-n');
  const goBtn = document.getElementById('pr02s1-go');
  const seqEl = document.getElementById('pr02s1-seq');
  if (!nInput) return;
  const render = () => {
    const n = Math.max(1, Math.min(999, parseInt(nInput.value) || 6));
    const seq = collatzSeq(n);
    seqEl.innerHTML = seq.map((v, i) => {
      const color = v === 1 ? '#10b981' : (v % 2 === 0 ? '#3b82f6' : '#b91c1c');
      return `<span style="color:${color}; font-weight:700;">${v}</span>${i < seq.length - 1 ? ' → ' : ''}`;
    }).join('');
  };
  goBtn.onclick = render;
  nInput.oninput = render;
  render();
}

function initStage_PR02_s2() {
  const nInput = document.getElementById('pr02s2-n');
  const goBtn = document.getElementById('pr02s2-go');
  const svg = document.getElementById('pr02s2-svg');
  const gridG = document.getElementById('pr02s2-grid');
  const path = document.getElementById('pr02s2-path');
  const dotsG = document.getElementById('pr02s2-dots');
  const stepsEl = document.getElementById('pr02s2-steps');
  const peakEl = document.getElementById('pr02s2-peak');
  const endEl = document.getElementById('pr02s2-end');
  if (!svg) return;
  const W = 320, H = 220, PAD_L = 30, PAD_B = 25, PAD_T = 10, PAD_R = 10;
  const colors = { even: '#3b82f6', odd: '#b91c1c', end: '#10b981' };
  const drawGrid = (maxY) => {
    gridG.innerHTML = '';
    // 横向网格
    for (let i = 0; i <= 4; i++) {
      const y = PAD_T + (H - PAD_T - PAD_B) * i / 4;
      const ln = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      ln.setAttribute('x1', PAD_L); ln.setAttribute('y1', y);
      ln.setAttribute('x2', W - PAD_R); ln.setAttribute('y2', y);
      ln.setAttribute('stroke', '#e9d5ff'); ln.setAttribute('stroke-width', '0.5');
      gridG.appendChild(ln);
    }
    // 纵向网格
    for (let i = 0; i <= 6; i++) {
      const x = PAD_L + (W - PAD_L - PAD_R) * i / 6;
      const ln = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      ln.setAttribute('x1', x); ln.setAttribute('y1', PAD_T);
      ln.setAttribute('x2', x); ln.setAttribute('y2', H - PAD_B);
      ln.setAttribute('stroke', '#e9d5ff'); ln.setAttribute('stroke-width', '0.5');
      gridG.appendChild(ln);
    }
    // y 轴标签
    for (let i = 0; i <= 4; i++) {
      const v = Math.round(maxY * (1 - i / 4));
      const y = PAD_T + (H - PAD_T - PAD_B) * i / 4;
      const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      t.setAttribute('x', PAD_L - 4); t.setAttribute('y', y + 3);
      t.setAttribute('text-anchor', 'end');
      t.setAttribute('font-size', '9'); t.setAttribute('fill', '#9ca3af');
      t.textContent = v;
      gridG.appendChild(t);
    }
  };
  const render = () => {
    const n = Math.max(1, Math.min(999, parseInt(nInput.value) || 7));
    const seq = collatzSeq(n);
    const maxV = Math.max(...seq, 10);
    drawGrid(maxV);
    const innerW = W - PAD_L - PAD_R;
    const innerH = H - PAD_T - PAD_B;
    const xs = seq.map((_, i) => PAD_L + innerW * i / Math.max(1, seq.length - 1));
    const ys = seq.map(v => PAD_T + innerH * (1 - v / maxV));
    path.setAttribute('points', xs.map((x, i) => `${x.toFixed(1)},${ys[i].toFixed(1)}`).join(' '));
    // 圆点
    dotsG.innerHTML = '';
    seq.forEach((v, i) => {
      const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      c.setAttribute('cx', xs[i]); c.setAttribute('cy', ys[i]); c.setAttribute('r', i === seq.length - 1 ? 5 : 3);
      c.setAttribute('fill', v === 1 ? colors.end : (v % 2 === 0 ? colors.even : colors.odd));
      c.setAttribute('stroke', 'white'); c.setAttribute('stroke-width', '1');
      dotsG.appendChild(c);
    });
    stepsEl.textContent = seq.length - 1;
    peakEl.textContent = maxV;
    endEl.textContent = seq[seq.length - 1];
  };
  goBtn.onclick = render;
  nInput.oninput = render;
  render();
}

function initStage_PR02_s3() {
  const svg = document.getElementById('pr02s3-svg');
  const gridG = document.getElementById('pr02s3-grid');
  const pathsG = document.getElementById('pr02s3-paths');
  const dotsG = document.getElementById('pr02s3-dots');
  const targetLine = document.getElementById('pr02s3-target');
  const targetLbl = document.getElementById('pr02s3-targetlbl');
  const goBtn = document.getElementById('pr02s3-go');
  const legendEl = document.getElementById('pr02s3-legend');
  if (!svg) return;
  const W = 600, H = 280, PAD_L = 35, PAD_B = 25, PAD_T = 10, PAD_R = 15;
  const palette = ['#7c3aed', '#3b82f6', '#10b981', '#f59e0b', '#ec4899'];
  // 对数 Y 轴：1..maxV → 像素 y（log2 缩放，能同时容纳 27 的 9232 和 3 的小值）
  const logY = (v, maxV) => {
    const lmin = 0;            // log2(1) = 0
    const lmax = Math.log2(maxV);
    const lv = Math.log2(Math.max(1, v));
    return PAD_T + (H - PAD_T - PAD_B) * (1 - (lv - lmin) / Math.max(0.01, lmax - lmin));
  };
  const render = () => {
    pathsG.innerHTML = ''; dotsG.innerHTML = ''; legendEl.innerHTML = ''; gridG.innerHTML = '';
    const ns = [];
    for (let i = 0; i < 5; i++) {
      const inp = document.getElementById('pr02s3-n' + i);
      ns.push(Math.max(1, Math.min(999, parseInt(inp.value) || 1)));
    }
    const allSeqs = ns.map(n => collatzSeq(n));
    const maxV = Math.max(...allSeqs.flat(), 10);
    const maxLen = Math.max(...allSeqs.map(s => s.length));
    // 网格：log2 等间距（1, 2, 4, 8, 16, 32, 64, ..., maxV）
    const lmax = Math.ceil(Math.log2(maxV));
    for (let exp = 0; exp <= lmax; exp++) {
      const v = Math.pow(2, exp);
      const y = logY(v, maxV);
      if (y < PAD_T - 1 || y > H - PAD_B + 1) continue;
      const ln = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      ln.setAttribute('x1', PAD_L); ln.setAttribute('y1', y);
      ln.setAttribute('x2', W - PAD_R); ln.setAttribute('y2', y);
      ln.setAttribute('stroke', '#e9d5ff'); ln.setAttribute('stroke-width', '0.5');
      gridG.appendChild(ln);
      const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      t.setAttribute('x', PAD_L - 4); t.setAttribute('y', y + 3);
      t.setAttribute('text-anchor', 'end');
      t.setAttribute('font-size', '9'); t.setAttribute('fill', '#9ca3af');
      t.textContent = v;
      gridG.appendChild(t);
    }
    // 目标线 n=1
    const targetY = logY(1, maxV);
    targetLine.setAttribute('y1', targetY); targetLine.setAttribute('y2', targetY);
    targetLbl.setAttribute('y', targetY - 4);
    const innerW = W - PAD_L - PAD_R;
    // 画每条路径
    allSeqs.forEach((seq, idx) => {
      const color = palette[idx];
      const xs = seq.map((_, i) => PAD_L + innerW * i / Math.max(1, maxLen - 1));
      const ys = seq.map(v => logY(v, maxV));
      const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
      poly.setAttribute('points', xs.map((x, i) => `${x.toFixed(1)},${ys[i].toFixed(1)}`).join(' '));
      poly.setAttribute('fill', 'none');
      poly.setAttribute('stroke', color);
      poly.setAttribute('stroke-width', '2.5');
      poly.setAttribute('stroke-linejoin', 'round');
      poly.setAttribute('opacity', '0.85');
      pathsG.appendChild(poly);
      // 起点圆点
      const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      c.setAttribute('cx', xs[0]); c.setAttribute('cy', ys[0]); c.setAttribute('r', '5');
      c.setAttribute('fill', color); c.setAttribute('stroke', 'white'); c.setAttribute('stroke-width', '1.5');
      dotsG.appendChild(c);
      // 图例
      const item = document.createElement('span');
      item.style.cssText = `display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; background: white; border-radius: 999px; border: 1px solid ${color}; color: ${color}; font-weight: 700;`;
      item.innerHTML = `<span style="display:inline-block; width:10px; height:10px; background:${color}; border-radius:50%;"></span> n=${ns[idx]} → ${seq.length - 1} 步`;
      legendEl.appendChild(item);
    });
  };
  goBtn.onclick = render;
  for (let i = 0; i < 5; i++) {
    const inp = document.getElementById('pr02s3-n' + i);
    if (inp) inp.oninput = render;
  }
  render();
}

function initStage_PR02_s4() {
  const nInput = document.getElementById('pr02s4-n');
  const goBtn = document.getElementById('pr02s4-go');
  const displayEl = document.getElementById('pr02s4-display');
  if (!nInput) return;
  const render = () => {
    const n = Math.max(1, Math.min(999, parseInt(nInput.value) || 11));
    const seq = collatzSeq(n);
    let html = '';
    seq.forEach((v, i) => {
      if (i > 0) {
        const op = v % 2 === 0 ? '÷2' : '×3+1';
        const opColor = v % 2 === 0 ? '#3b82f6' : '#b91c1c';
        html += ` <span style="color:${opColor}; font-weight: 700; font-size: 13px;">→${op}→</span> `;
      }
      const color = v === 1 ? '#10b981' : (v % 2 === 0 ? '#3b82f6' : '#b91c1c');
      const bg = v === 1 ? '#dcfce7' : (v % 2 === 0 ? '#dbeafe' : '#fee2e2');
      html += `<span style="display:inline-block; padding: 2px 10px; background: ${bg}; color: ${color}; border: 2px solid ${color}; border-radius: 6px; font-weight: 700; font-family: 'Courier New', monospace;">${v}</span>`;
    });
    const evenCount = seq.slice(0, -1).filter(v => v % 2 === 0).length;
    const oddCount = seq.slice(0, -1).filter(v => v % 2 === 1).length;
    html += `<div style="margin-top: 10px; font-size: 13px; color: #6b7280;">🔴 奇数 ×3+1 共 <strong>${oddCount}</strong> 次｜🔵 偶数 ÷2 共 <strong>${evenCount}</strong> 次｜共 <strong>${seq.length - 1}</strong> 步</div>`;
    displayEl.innerHTML = html;
  };
  goBtn.onclick = render;
  nInput.oninput = render;
  render();
}

function initStage_PR02_s5() {
  const cv = document.getElementById('pr02s5-cv');
  const slider = document.getElementById('pr02s5-depth');
  const dvEl = document.getElementById('pr02s5-dv');
  const nodesEl = document.getElementById('pr02s5-nodes');
  const maxvEl = document.getElementById('pr02s5-maxv');
  if (!cv) return;
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  // BFS 反向树
  const buildTree = (depth) => {
    const levels = [[1]];
    const seen = new Set([1]);
    for (let d = 0; d < depth; d++) {
      const next = [];
      levels[d].forEach(n => {
        // 前驱 1: 2n
        const c1 = 2 * n;
        if (!seen.has(c1) && c1 < 50000) { seen.add(c1); next.push(c1); }
        // 前驱 2: (n-1)/3, 当 (n-1) % 3 === 0 且 (n-1)/3 是奇数 且 > 0
        if (n > 1 && (n - 1) % 3 === 0) {
          const c2 = (n - 1) / 3;
          if (c2 > 0 && c2 % 2 === 1 && !seen.has(c2)) { seen.add(c2); next.push(c2); }
        }
      });
      levels.push(next);
    }
    return levels;
  };
  const draw = () => {
    const depth = +slider.value;
    dvEl.textContent = depth;
    const levels = buildTree(depth);
    const allVals = levels.flat();
    const maxV = Math.max(...allVals, 10);
    const totalNodes = allVals.length;
    nodesEl.textContent = totalNodes;
    maxvEl.textContent = maxV;
    ctx.clearRect(0, 0, W, H);
    // 画连线（父→子）
    ctx.strokeStyle = '#c4b5fd';
    ctx.lineWidth = 1;
    for (let d = 0; d < levels.length - 1; d++) {
      const y = 30 + d * (H - 50) / (levels.length - 1);
      const y2 = 30 + (d + 1) * (H - 50) / (levels.length - 1);
      const colW = W / Math.max(1, levels[d + 1].length);
      levels[d + 1].forEach((v, i) => {
        // 找 v 的父节点（2v 是父 OR (v-1)/3 是父）
        let parentIdx = -1;
        for (let p = 0; p < levels[d].length; p++) {
          if (levels[d][p] === 2 * v || (v > 1 && v % 2 === 1 && 3 * v + 1 === levels[d][p])) {
            parentIdx = p;
            break;
          }
        }
        if (parentIdx >= 0) {
          const px = (parentIdx + 0.5) * W / levels[d].length;
          const cx = (i + 0.5) * colW;
          ctx.beginPath();
          ctx.moveTo(px, y); ctx.lineTo(cx, y2);
          ctx.stroke();
        }
      });
    }
    // 画节点
    for (let d = 0; d < levels.length; d++) {
      const y = 30 + d * (H - 50) / Math.max(1, levels.length - 1);
      const colW = W / Math.max(1, levels[d].length);
      levels[d].forEach((v, i) => {
        const cx = (i + 0.5) * colW;
        const r = 4 + 10 * (1 - d / Math.max(1, levels.length - 1));
        // 颜色按值大小
        const t = Math.min(1, Math.log2(Math.max(1, v)) / Math.log2(maxV + 1));
        const hue = 280 - t * 100;
        ctx.fillStyle = `hsl(${hue}, 70%, 60%)`;
        ctx.strokeStyle = 'white'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(cx, y, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        // 标 1
        if (v === 1) {
          ctx.fillStyle = '#10b981';
          ctx.beginPath(); ctx.arc(cx, y, r + 3, 0, Math.PI * 2); ctx.stroke();
        }
        // 标注数字（小数字标，大数字不标）
        if (v < 100) {
          ctx.fillStyle = 'white'; ctx.font = 'bold 9px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(v, cx, y);
        }
      });
    }
    // 标注根
    ctx.fillStyle = '#6b21a8'; ctx.font = 'bold 10px sans-serif'; ctx.textAlign = 'left';
    ctx.fillText('根 = 1', 4, 14);
  };
  slider.oninput = draw;
  draw();
}

    {

/* ===================== 5 步直观讲解：PR03 init ===================== */
function gcd(a, b) { return b === 0 ? a : gcd(b, a % b); }
function euclidPythagorean(m, n) {
  const a = m * m - n * n, b = 2 * m * n, c = m * m + n * n;
  return [Math.abs(a), Math.abs(b), c];
}

function initStage_PR03_s1() {
  const aSlider = document.getElementById('pr03s1-a-slider');
  const bSlider = document.getElementById('pr03s1-b-slider');
  const avEl = document.getElementById('pr03s1-av');
  const bvEl = document.getElementById('pr03s1-bv');
  const resultEl = document.getElementById('pr03s1-result');
  const aLbl = document.getElementById('pr03s1-a');
  const bLbl = document.getElementById('pr03s1-b');
  const cLbl = document.getElementById('pr03s1-c');
  if (!aSlider) return;
  const update = () => {
    const a = +aSlider.value, b = +bSlider.value;
    avEl.textContent = a;
    bvEl.textContent = b;
    aLbl.textContent = `a = ${a}`;
    bLbl.textContent = `b = ${b}`;
    const c2 = a * a + b * b;
    const c = Math.sqrt(c2);
    const isInt = Math.abs(c - Math.round(c)) < 1e-6;
    cLbl.textContent = isInt ? `c = ${Math.round(c)}` : `c ≈ ${c.toFixed(2)}`;
    if (isInt) {
      resultEl.style.background = '#dcfce7';
      resultEl.style.color = '#15803d';
      resultEl.innerHTML = `✅ a² + b² = ${a * a} + ${b * b} = <span style="font-size:18px;">${c2}</span>，√${c2} = ${Math.round(c)}（整数！是勾股数）`;
    } else {
      resultEl.style.background = '#fee2e2';
      resultEl.style.color = '#b91c1c';
      resultEl.innerHTML = `❌ a² + b² = ${a * a} + ${b * b} = ${c2}，√${c2} ≈ ${c.toFixed(3)}（不是整数，不是勾股数）`;
    }
  };
  aSlider.oninput = update;
  bSlider.oninput = update;
  document.querySelectorAll('.pr03s1-preset').forEach(btn => {
    btn.onclick = () => {
      aSlider.value = btn.dataset.a;
      bSlider.value = btn.dataset.b;
      update();
    };
  });
  update();
}

function initStage_PR03_s2() {
  const mSlider = document.getElementById('pr03s2-m');
  const nSlider = document.getElementById('pr03s2-n');
  const mvEl = document.getElementById('pr03s2-mv');
  const nvEl = document.getElementById('pr03s2-nv');
  const aEl = document.getElementById('pr03s2-a');
  const bEl = document.getElementById('pr03s2-b');
  const cEl = document.getElementById('pr03s2-c');
  const verifyEl = document.getElementById('pr03s2-verify');
  if (!mSlider) return;
  const update = () => {
    let m = +mSlider.value, n = +nSlider.value;
    if (n >= m) { n = m - 1; nSlider.value = n; }
    mvEl.textContent = m;
    nvEl.textContent = n;
    const [a, b, c] = euclidPythagorean(m, n);
    aEl.textContent = a;
    bEl.textContent = b;
    cEl.textContent = c;
    const ok = a * a + b * b === c * c;
    verifyEl.style.background = ok ? '#dcfce7' : '#fee2e2';
    verifyEl.style.color = ok ? '#15803d' : '#b91c1c';
    verifyEl.innerHTML = ok
      ? `✅ ${a}² + ${b}² = ${a * a} + ${b * b} = ${c * c} = ${c}²`
      : `❌ ${a}² + ${b}² = ${a * a + b * b} ≠ ${c * c}`;
  };
  mSlider.oninput = update;
  nSlider.oninput = update;
  update();
}

function initStage_PR03_s3() {
  const tbody = document.getElementById('pr03s3-tbody');
  if (!tbody) return;
  const samples = [
    { m: 3, n: 2 },
    { m: 4, n: 2 },
    { m: 3, n: 1 },
    { m: 5, n: 3 },
    { m: 6, n: 2 },
    { m: 7, n: 4 },
  ];
  const render = (highlight) => {
    tbody.innerHTML = '';
    samples.forEach(({ m, n }) => {
      const [a, b, c] = euclidPythagorean(m, n);
      const g = gcd(m, n);
      const mnOdd = (m - n) % 2 === 1;
      const prim = g === 1 && mnOdd;
      const isHi = highlight && highlight.m === m && highlight.n === n;
      const row = document.createElement('tr');
      row.style.background = isHi ? '#fef3c7' : (prim ? '#f0fdf4' : '#fef2f2');
      row.style.fontWeight = isHi ? 700 : 400;
      row.innerHTML = `
        <td style="padding: 6px 8px; border: 1px solid #e9d5ff; text-align: center;">${m}</td>
        <td style="padding: 6px 8px; border: 1px solid #e9d5ff; text-align: center;">${n}</td>
        <td style="padding: 6px 8px; border: 1px solid #e9d5ff; text-align: center;">${g}</td>
        <td style="padding: 6px 8px; border: 1px solid #e9d5ff; text-align: center;">${mnOdd ? '奇' : '偶'}</td>
        <td style="padding: 6px 8px; border: 1px solid #e9d5ff; text-align: center; font-family: 'Courier New', monospace;">(${a}, ${b}, ${c})</td>
        <td style="padding: 6px 8px; border: 1px solid #e9d5ff; text-align: center; font-weight: 700; color: ${prim ? '#15803d' : '#b91c1c'};">${prim ? '✓ 本原' : '✗ 非本原'}</td>
      `;
      tbody.appendChild(row);
    });
  };
  render();
  document.querySelectorAll('.pr03s3-test').forEach(btn => {
    btn.onclick = () => {
      const m = +btn.dataset.m, n = +btn.dataset.n;
      render({ m, n });
      const mSlider = document.getElementById('pr03s2-m');
      const nSlider = document.getElementById('pr03s2-n');
      if (mSlider) mSlider.value = m;
      if (nSlider) nSlider.value = n;
    };
  });
}

function initStage_PR03_s4() {
  const countEl = document.getElementById('pr03s4-count');
  const first5El = document.getElementById('pr03s4-first5');
  const tableEl = document.getElementById('pr03s4-table');
  const sgrid = document.getElementById('pr03s4-sgrid');
  const sdots = document.getElementById('pr03s4-sdots');
  if (!countEl) return;
  const list = [];
  for (let m = 2; m <= 50; m++) {
    for (let n = 1; n < m; n++) {
      if (gcd(m, n) === 1 && (m - n) % 2 === 1) {
        const [a, b, c] = euclidPythagorean(m, n);
        if (c <= 1000) list.push({ a, b, c, m, n });
      }
    }
  }
  list.sort((x, y) => x.c - y.c);
  countEl.textContent = list.length;
  first5El.textContent = list.slice(0, 5).map(t => `(${t.a},${t.b},${t.c})`).join(' ');
  tableEl.innerHTML = list.map(t => `<div>${t.c.toString().padStart(4)} : (${t.a}, ${t.b}, ${t.c})  ←  m=${t.m}, n=${t.n}</div>`).join('');
  sgrid.innerHTML = ''; sdots.innerHTML = '';
  const W = 320, H = 280, PAD = 30;
  const maxV = 1000;
  for (let v = 0; v <= 1000; v += 200) {
    const x = PAD + (W - 2 * PAD) * v / maxV;
    const y = PAD + (H - 2 * PAD) * v / maxV;
    const ln1 = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    ln1.setAttribute('x1', x); ln1.setAttribute('y1', PAD);
    ln1.setAttribute('x2', x); ln1.setAttribute('y2', H - PAD);
    ln1.setAttribute('stroke', '#e9d5ff'); ln1.setAttribute('stroke-width', '0.5');
    sgrid.appendChild(ln1);
    const ln2 = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    ln2.setAttribute('x1', PAD); ln2.setAttribute('y1', y);
    ln2.setAttribute('x2', W - PAD); ln2.setAttribute('y2', y);
    ln2.setAttribute('stroke', '#e9d5ff'); ln2.setAttribute('stroke-width', '0.5');
    sgrid.appendChild(ln2);
  }
  for (let v = 0; v <= 1000; v += 200) {
    const x = PAD + (W - 2 * PAD) * v / maxV;
    const y = PAD + (H - 2 * PAD) * v / maxV;
    const t1 = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    t1.setAttribute('x', x); t1.setAttribute('y', H - PAD + 14);
    t1.setAttribute('text-anchor', 'middle');
    t1.setAttribute('font-size', '9'); t1.setAttribute('fill', '#9ca3af');
    t1.textContent = v;
    sgrid.appendChild(t1);
    const t2 = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    t2.setAttribute('x', PAD - 4); t2.setAttribute('y', y + 3);
    t2.setAttribute('text-anchor', 'end');
    t2.setAttribute('font-size', '9'); t2.setAttribute('fill', '#9ca3af');
    t2.textContent = v;
    sgrid.appendChild(t2);
  }
  list.forEach(t => {
    const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    c.setAttribute('cx', PAD + (W - 2 * PAD) * t.a / maxV);
    c.setAttribute('cy', PAD + (H - 2 * PAD) * t.b / maxV);
    c.setAttribute('r', '2.5');
    c.setAttribute('fill', '#7c3aed');
    c.setAttribute('opacity', '0.7');
    sdots.appendChild(c);
  });
  const diag = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  diag.setAttribute('x1', PAD); diag.setAttribute('y1', H - PAD);
  diag.setAttribute('x2', W - PAD); diag.setAttribute('y2', PAD);
  diag.setAttribute('stroke', '#fbbf24'); diag.setAttribute('stroke-width', '1');
  diag.setAttribute('stroke-dasharray', '4 3');
  sgrid.appendChild(diag);
}

function initStage_PR03_s5() {
  const pool = [];
  for (let m = 2; m <= 50; m++) {
    for (let n = 1; n < m; n++) {
      if (gcd(m, n) === 1 && (m - n) % 2 === 1) {
        const [a, b, c] = euclidPythagorean(m, n);
        if (c <= 1000) pool.push({ a, b, c, m, n });
      }
    }
  }
  const targetEl = document.getElementById('pr03s5-target');
  const hintEl = document.getElementById('pr03s5-hint');
  const poolSizeEl = document.getElementById('pr03s5-poolsize');
  const mInput = document.getElementById('pr03s5-m');
  const nInput = document.getElementById('pr03s5-n');
  const aEl = document.getElementById('pr03s5-a');
  const bEl = document.getElementById('pr03s5-b');
  const cEl = document.getElementById('pr03s5-c');
  const checkEl = document.getElementById('pr03s5-check');
  if (!targetEl) return;
  let target = null;
  const newGame = () => {
    target = pool[Math.floor(Math.random() * pool.length)];
    targetEl.textContent = `(${target.a}, ${target.b}, ${target.c})`;
    hintEl.textContent = `提示 1：c = ${target.c}`;
    poolSizeEl.textContent = pool.length;
  };
  const update = () => {
    let m = +mInput.value, n = +nInput.value;
    if (n >= m) { n = m - 1; nInput.value = n; }
    const [a, b, c] = euclidPythagorean(m, n);
    aEl.textContent = a; bEl.textContent = b; cEl.textContent = c;
    const g = gcd(m, n);
    const mnOdd = (m - n) % 2 === 1;
    const prim = g === 1 && mnOdd;
    checkEl.textContent = `m − n = ${m - n}（${mnOdd ? '奇' : '偶'}）｜gcd(${m},${n})=${g} ${prim ? '✅ 本原' : '❌ 非本原'}`;
    checkEl.style.color = prim ? '#15803d' : '#b91c1c';
    if (target && a === target.a && b === target.b && c === target.c) {
      targetEl.innerHTML = `🎉 <span style="color: #15803d;">答对！</span> (${target.a}, ${target.b}, ${target.c}) ← m=${target.m}, n=${target.n}`;
    }
  };
  document.getElementById('pr03s5-new').onclick = newGame;
  document.getElementById('pr03s5-giveup').onclick = () => {
    if (target) targetEl.innerHTML = `答案：(${target.a}, ${target.b}, ${target.c}) ← m=${target.m}, n=${target.n}`;
  };
  document.getElementById('pr03s5-test').onclick = update;
  mInput.oninput = update;
  nInput.oninput = update;
  newGame();
  update();
}

/* ===================== 5 步直观讲解：PR04 init ===================== */
function initStage_PR04_s1() {
  const grid = document.getElementById('pr04s1-grid');
  const palette = document.getElementById('pr04s1-palette');
  const msg = document.getElementById('pr04s1-msg');
  if (!grid) return;
  const COLORS = ['#ef4444', '#3b82f6', '#10b981', '#f59e0b'];
  let colorIdx = 0;
  let filled = Array(36).fill(-1);
  // 初始化网格
  grid.innerHTML = '';
  for (let i = 0; i < 36; i++) {
    const cell = document.createElement('div');
    cell.style.cssText = 'width: 40px; height: 40px; background: white; border: 1px solid #e9d5ff; border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px;';
    cell.dataset.idx = i;
    cell.onclick = () => {
      // 计算邻居（4 邻）
      const r = Math.floor(i / 6), c = i % 6;
      const neighbors = [];
      if (r > 0) neighbors.push(i - 6);
      if (r < 5) neighbors.push(i + 6);
      if (c > 0) neighbors.push(i - 1);
      if (c < 5) neighbors.push(i + 1);
      // 检查邻居是否同色
      const conflict = neighbors.some(n => filled[n] === colorIdx);
      if (conflict) {
        msg.innerHTML = '<strong style="color:#b91c1c;">⚠️ 相邻格子已是这个色！</strong> 换个色或换个格子。';
        return;
      }
      filled[i] = colorIdx;
      cell.style.background = COLORS[colorIdx];
      msg.innerHTML = '✅ 涂色成功！<strong>' + (colorIdx + 1) + ' 色</strong>';
    };
    grid.appendChild(cell);
  }
  // 调色板
  palette.innerHTML = '';
  COLORS.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.style.cssText = `width: 40px; height: 40px; background: ${c}; border: ${i === colorIdx ? '4px solid #1e40af' : '2px solid #e9d5ff'}; border-radius: 8px; cursor: pointer;`;
    btn.dataset.idx = i;
    btn.onclick = () => {
      colorIdx = i;
      palette.querySelectorAll('button').forEach((b, j) => {
        b.style.border = j === i ? '4px solid #1e40af' : '2px solid #e9d5ff';
      });
    };
    palette.appendChild(btn);
  });
  // 清空
  document.getElementById('pr04s1-clear').onclick = () => {
    filled = Array(36).fill(-1);
    grid.querySelectorAll('div').forEach(c => c.style.background = 'white');
    msg.innerHTML = '🔄 已清空';
  };
  // 自动填 2 色（棋盘格）
  document.getElementById('pr04s1-auto').onclick = () => {
    filled = Array(36).fill(-1);
    grid.querySelectorAll('div').forEach((c, i) => {
      const r = Math.floor(i / 6), col = i % 6;
      const idx = (r + col) % 2;
      filled[i] = idx;
      c.style.background = COLORS[idx];
    });
    msg.innerHTML = '✨ 棋盘填色完成——<strong>只用 2 色</strong>！6×6 网格太简单。';
  };
}

    filled = {};
    svg.innerHTML = '';
    currentMap.regions.forEach(r => {
      const p = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
      p.setAttribute('points', r.poly);
      p.setAttribute('fill', '#fde68a');
      p.setAttribute('stroke', '#7c3aed');
      p.setAttribute('stroke-width', '2');
      p.style.cursor = 'pointer';
      p.dataset.id = r.id;
      p.onclick = () => {
        const adj = r.adj;
        const conflict = adj.some(aid => filled[aid] === colorIdx);
        if (conflict) {
          msg.innerHTML = '<strong style="color:#b91c1c;">⚠️ 相邻区域已是这个色！</strong> 换个色或换个区域。';
          return;
        }
        filled[r.id] = colorIdx;
        p.setAttribute('fill', COLORS[colorIdx]);
        msg.innerHTML = '✅ ' + r.id + ' 涂' + (colorIdx + 1) + '色';
      };
      // 标 id
      const lbl = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      const [x, y] = r.poly.split(' ')[0].split(',');
      lbl.setAttribute('x', +x + 15);
      lbl.setAttribute('y', +y + 20);
      lbl.setAttribute('font-size', '14');
      lbl.setAttribute('font-weight', '700');
      lbl.setAttribute('fill', '#7c3aed');
      lbl.setAttribute('pointer-events', 'none');
      lbl.textContent = r.id;
      svg.appendChild(p);
      svg.appendChild(lbl);
    });
  };
  render();
  // 调色板
  palette.innerHTML = '';
  COLORS.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.style.cssText = `width: 36px; height: 36px; background: ${c}; border: ${i === colorIdx ? '4px solid #1e40af' : '2px solid #e9d5ff'}; border-radius: 8px; cursor: pointer;`;
    btn.onclick = () => {
      colorIdx = i;
      palette.querySelectorAll('button').forEach((b, j) => b.style.border = j === i ? '4px solid #1e40af' : '2px solid #e9d5ff');
    };
    palette.appendChild(btn);
  });
  // 切换地图
  document.querySelectorAll('.pr04s3-map').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('.pr04s3-map').forEach(b => {
        b.classList.remove('primary');
        b.classList.add('ghost');
      });
      btn.classList.remove('ghost');
      btn.classList.add('primary');
      currentMap = MAPS[btn.dataset.map];
      render();
    };
  });
  document.getElementById('pr04s3-clear').onclick = () => { filled = {}; render(); msg.innerHTML = '🔄 已清空'; };
  document.getElementById('pr04s3-solve').onclick = () => {
    // 贪心 4 色：按顺序分配每区域最小可用色
    const adjMap = {};
    currentMap.regions.forEach(r => { adjMap[r.id] = r.adj; });
    filled = {};
    currentMap.regions.forEach(r => {
      const used = new Set(r.adj.map(a => filled[a]).filter(x => x !== undefined));
      for (let i = 0; i < 4; i++) {
        if (!used.has(i)) { filled[r.id] = i; break; }
      }
    });
    svg.querySelectorAll('polygon').forEach(p => {
      p.setAttribute('fill', COLORS[filled[p.dataset.id] || 0]);
    });
    msg.innerHTML = '🪄 贪心 4 色完成——4 色够用！';
  };
}

/* ===================== 5 步直观讲解：PR05 init ===================== */
function pr05Layout(n, cx, cy, r) {
  const pts = [];
  for (let i = 0; i < n; i++) {
    const angle = (i / n) * 2 * Math.PI - Math.PI / 2;
    pts.push({ x: cx + r * Math.cos(angle), y: cy + r * Math.sin(angle), id: i });
  }
  return pts;
}

function initStage_PR05_s1() {
  const svg = document.getElementById('pr05s1-svg');
  const countEl = document.getElementById('pr05s1-count');
  const redTriEl = document.getElementById('pr05s1-red-tri');
  const blueTriEl = document.getElementById('pr05s1-blue-tri');
  const msgEl = document.getElementById('pr05s1-msg');
  if (!svg) return;
  const N = 6;
  const pts = pr05Layout(N, 160, 160, 110);
  let edges = {}; // key: "i-j" -> 0=unset, 1=red, 2=blue
  let mode = 1; // 1=red, 2=blue
  const edgeKey = (i, j) => i < j ? `${i}-${j}` : `${j}-${i}`;
  const countMonochrome = () => {
    let redTri = 0, blueTri = 0;
    for (let i = 0; i < N; i++) for (let j = i + 1; j < N; j++) for (let k = j + 1; k < N; k++) {
      const a = edges[edgeKey(i, j)], b = edges[edgeKey(i, k)], c = edges[edgeKey(j, k)];
      if (a === 1 && b === 1 && c === 1) redTri++;
      if (a === 2 && b === 2 && c === 2) blueTri++;
    }
    return { redTri, blueTri, total: redTri + blueTri };
  };
  const render = () => {
    svg.innerHTML = '';
    // 边
    for (let i = 0; i < N; i++) for (let j = i + 1; j < N; j++) {
      const ln = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      ln.setAttribute('x1', pts[i].x); ln.setAttribute('y1', pts[i].y);
      ln.setAttribute('x2', pts[j].x); ln.setAttribute('y2', pts[j].y);
      const e = edges[edgeKey(i, j)];
      if (e === 1) { ln.setAttribute('stroke', '#ef4444'); ln.setAttribute('stroke-width', '3'); }
      else if (e === 2) { ln.setAttribute('stroke', '#3b82f6'); ln.setAttribute('stroke-width', '3'); }
      else { ln.setAttribute('stroke', '#d1d5db'); ln.setAttribute('stroke-width', '1.5'); }
      ln.style.cursor = 'pointer';
      ln.onclick = () => {
        edges[edgeKey(i, j)] = mode;
        render();
      };
      svg.appendChild(ln);
    }
    // 点
    pts.forEach(p => {
      const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      c.setAttribute('cx', p.x); c.setAttribute('cy', p.y); c.setAttribute('r', '20');
      c.setAttribute('fill', 'white'); c.setAttribute('stroke', '#7c3aed'); c.setAttribute('stroke-width', '3');
      svg.appendChild(c);
      const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      t.setAttribute('x', p.x); t.setAttribute('y', p.y + 5);
      t.setAttribute('text-anchor', 'middle');
      t.setAttribute('font-size', '14'); t.setAttribute('font-weight', '700');
      t.setAttribute('fill', '#6b21a8');
      t.textContent = p.id + 1;
      svg.appendChild(t);
    });

    }
  };
  render();
  document.getElementById('pr05s1-mode-red').onclick = () => { mode = 1; document.getElementById('pr05s1-mode-red').classList.replace('ghost', 'primary'); document.getElementById('pr05s1-mode-blue').classList.replace('primary', 'ghost'); };
  document.getElementById('pr05s1-mode-blue').onclick = () => { mode = 2; document.getElementById('pr05s1-mode-blue').classList.replace('ghost', 'primary'); document.getElementById('pr05s1-mode-red').classList.replace('primary', 'ghost'); };
  document.getElementById('pr05s1-clear').onclick = () => { edges = {}; render(); };
  document.getElementById('pr05s1-random').onclick = () => {

    for (let i = 0; i < N; i++) for (let j = i + 1; j < N; j++) {

}

function initStage_PR05_s2() {
  const svg = document.getElementById('pr05s2-svg');
  if (!svg) return;
  const N = 6;
  const pts = pr05Layout(N, 160, 160, 110);
  let step = 0;
  let edges = {};
  const edgeKey = (i, j) => i < j ? `${i}-${j}` : `${j}-${i}`;
  const render = () => {
    svg.innerHTML = '';
    // 高亮中心点 A (id=0)
    const A = pts[0];
    // 边
    for (let i = 0; i < N; i++) for (let j = i + 1; j < N; j++) {
      const ln = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      ln.setAttribute('x1', pts[i].x); ln.setAttribute('y1', pts[i].y);
      ln.setAttribute('x2', pts[j].x); ln.setAttribute('y2', pts[j].y);
      let stroke = '#d1d5db', width = 1.5;
      const e = edges[edgeKey(i, j)];
      if (e === 1) { stroke = '#ef4444'; width = 3; }
      if (e === 2) { stroke = '#3b82f6'; width = 3; }
      // 高亮 A 连出去的边
      if (step >= 2 && (i === 0 || j === 0)) { width = 4; }
      ln.setAttribute('stroke', stroke); ln.setAttribute('stroke-width', width);
      if (step >= 3 && (i === 0 || j === 0)) ln.setAttribute('opacity', '0.7');
      svg.appendChild(ln);
    }
    // 点
    pts.forEach(p => {
      const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      c.setAttribute('cx', p.x); c.setAttribute('cy', p.y);
      const isA = p.id === 0;
      const isBCD = step >= 3 && [1, 2, 3].includes(p.id);
      c.setAttribute('r', isA ? 26 : (isBCD ? 22 : 18));
      c.setAttribute('fill', isA ? '#fef3c7' : (isBCD ? '#fee2e2' : 'white'));
      c.setAttribute('stroke', isA ? '#f59e0b' : (isBCD ? '#ef4444' : '#7c3aed'));
      c.setAttribute('stroke-width', isA ? 4 : 3);
      svg.appendChild(c);
      const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      t.setAttribute('x', p.x); t.setAttribute('y', p.y + 5);
      t.setAttribute('text-anchor', 'middle');
      t.setAttribute('font-size', '14'); t.setAttribute('font-weight', '700');
      t.setAttribute('fill', isA ? '#92400e' : '#6b21a8');
      t.textContent = isA ? 'A' : (isBCD ? ['B', 'C', 'D'][p.id - 1] : (p.id + 1).toString());
      svg.appendChild(t);
    });
    // 高亮 B-C 边
    if (step >= 4) {
      const ln = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      ln.setAttribute('x1', pts[1].x); ln.setAttribute('y1', pts[1].y);
      ln.setAttribute('x2', pts[2].x); ln.setAttribute('y2', pts[2].y);
      ln.setAttribute('stroke', edges[edgeKey(1, 2)] === 1 ? '#ef4444' : '#3b82f6');
      ln.setAttribute('stroke-width', '5');
      svg.appendChild(ln);
    }
  };
  const nextBtn = document.getElementById('pr05s2-next');
  const resetBtn = document.getElementById('pr05s2-reset');
  if (nextBtn) nextBtn.onclick = () => {
    step = (step + 1) % 5;
    if (step === 0) {
      edges = {};
    } else if (step === 1) {
      // A 连 5 条边先不染色
    } else if (step === 2) {
      // 染 3 条红（鸽笼）
      edges[edgeKey(0, 1)] = 1;
      edges[edgeKey(0, 2)] = 1;
      edges[edgeKey(0, 3)] = 1;
    } else if (step === 3) {
      // B-C 边还没确定
    } else if (step === 4) {
      // B-C 红，A-B-C 红三角
      edges[edgeKey(1, 2)] = 1;
    }
    nextBtn.textContent = step === 0 ? '▶ 下一步' : (step < 4 ? '▶ 下一步' : '🔄 重新演示');
    render();
  };
  if (resetBtn) resetBtn.onclick = () => { step = 0; edges = {}; nextBtn.textContent = '▶ 下一步'; render(); };
  render();
}

function initStage_PR05_s3() {
  const svg = document.getElementById('pr05s3-svg');
  const statusEl = document.getElementById('pr05s3-status');
  if (!svg) return;
  const N = 5;
  const pts = pr05Layout(N, 160, 160, 110);
  svg.innerHTML = '';
  // 画所有边：C₅ 圈红，对角线蓝
  for (let i = 0; i < N; i++) {
    for (let j = i + 1; j < N; j++) {
      const ln = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      ln.setAttribute('x1', pts[i].x); ln.setAttribute('y1', pts[i].y);
      ln.setAttribute('x2', pts[j].x); ln.setAttribute('y2', pts[j].y);
      const diff = j - i;
      const isCycle = diff === 1 || diff === N - 1; // 圈边
      ln.setAttribute('stroke', isCycle ? '#ef4444' : '#3b82f6');
      ln.setAttribute('stroke-width', '3');
      svg.appendChild(ln);
    }
  }
  // 点
  pts.forEach(p => {
    const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    c.setAttribute('cx', p.x); c.setAttribute('cy', p.y); c.setAttribute('r', '22');
    c.setAttribute('fill', 'white'); c.setAttribute('stroke', '#7c3aed'); c.setAttribute('stroke-width', '3');
    svg.appendChild(c);
    const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    t.setAttribute('x', p.x); t.setAttribute('y', p.y + 5);
    t.setAttribute('text-anchor', 'middle');
    t.setAttribute('font-size', '14'); t.setAttribute('font-weight', '700');
    t.setAttribute('fill', '#6b21a8');
    t.textContent = p.id + 1;
    svg.appendChild(t);
  });
  // 验证：枚举所有 3 元组，确认无单色三角
  let redTri = 0, blueTri = 0;
  for (let i = 0; i < N; i++) for (let j = i + 1; j < N; j++) for (let k = j + 1; k < N; k++) {
    const edges = [
      { i, j, isCycle: Math.abs(i - j) === 1 || Math.abs(i - j) === N - 1 },
      { i, k, isCycle: Math.abs(i - k) === 1 || Math.abs(i - k) === N - 1 },
      { j, k, isCycle: Math.abs(j - k) === 1 || Math.abs(j - k) === N - 1 },
    ];
    if (edges.every(e => e.isCycle)) redTri++;
    if (edges.every(e => !e.isCycle)) blueTri++;
  }
  if (statusEl) {
    statusEl.innerHTML = `✅ C₅ 验证：红色三角 <strong>${redTri}</strong> 个，蓝色三角 <strong>${blueTri}</strong> 个 → 总计 0 个单色三角形！`;
  }
}

function initStage_PR05_s4() {

  };

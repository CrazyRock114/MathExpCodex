    btn.onclick = () => {
      document.querySelectorAll('.pr05s4-n').forEach(b => { b.classList.remove('primary'); b.classList.add('ghost'); });
      btn.classList.remove('ghost'); btn.classList.add('primary');
      currentN = +btn.dataset.n;
    };
  });
  document.getElementById('pr05s4-run').onclick = () => {
    const N = currentN;
    const trials = 1000;
    let zeroCount = 0;
    for (let t = 0; t < trials; t++) {

      const colors = [];
      for (let i = 0; i < N; i++) for (let j = i + 1; j < N; j++) {
        colors.push(Math.random() < 0.5 ? 1 : 2);
      }
      // 检查单色三角
      let hasMono = false;
      let idx = 0;
      const e = (i, j) => colors[i < j ? (i * (2 * N - i - 1) / 2 + (j - i - 1)) : (j * (2 * N - j - 1) / 2 + (i - j - 1))];
      for (let i = 0; i < N && !hasMono; i++) for (let j = i + 1; j < N && !hasMono; j++) for (let k = j + 1; k < N && !hasMono; k++) {
        if (e(i, j) === e(i, k) && e(i, k) === e(j, k)) hasMono = true;
      }
      if (!hasMono) zeroCount++;
    }
    updateBar(zeroCount, trials);
  };
  // 初始跑一次 N=4
  document.getElementById('pr05s4-run').click();
}

function initStage_PR05_s5() {

  if (!runBtn) return;

  let hist = Array(20).fill(0);
  let chart = null;
  if (chart) { try { chart.destroy(); } catch(e){} }
  chart = new Chart(chartCv.getContext('2d'), {
    type: 'bar',
    data: {
      labels: Array.from({length: 20}, (_, i) => i.toString()),
      datasets: [{
        label: '单色三角形数', data: hist, backgroundColor: '#a855f7', borderColor: '#7c3aed', borderWidth: 1,
      }]
    },
    options: {
      responsive: false, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: { x: { title: { display: true, text: '单色三角形数量' } }, y: { beginAtZero: true } }
    }
  });
  const runOne = (callback) => {
    const N = 6;
    const colors = [];
    for (let i = 0; i < N; i++) for (let j = i + 1; j < N; j++) {
      colors.push(Math.random() < 0.5 ? 1 : 2);
    }
    let monoCount = 0;
    let idx = 0;
    const e = (i, j) => colors[i < j ? (i * (2 * N - i - 1) / 2 + (j - i - 1)) : (j * (2 * N - j - 1) / 2 + (i - j - 1))];
    for (let i = 0; i < N; i++) for (let j = i + 1; j < N; j++) for (let k = j + 1; k < N; k++) {
      if (e(i, j) === e(i, k) && e(i, k) === e(j, k)) monoCount++;
    }
    callback(monoCount);
  };
  let yes = 0, no = 0, done = 0;
  const resetStats = () => { yes = 0; no = 0; done = 0; hist = Array(20).fill(0); };
  resetStats();
  runBtn.onclick = () => {
    if (running) return;
    running = true;
    resetStats();
    runBtn.textContent = '⏳ 跑中...';
    runBtn.disabled = true;
    const tick = () => {
      if (!running) return;
      runOne((monoCount) => {
        done++;
        if (monoCount > 0) yes++; else no++;
        if (monoCount < 20) hist[monoCount]++;
        doneEl.textContent = `${done} / 1000`;
        yesEl.textContent = yes;
        noEl.textContent = no;
        progEl.style.width = (done / 10) + '%';
        chart.data.datasets[0].data = hist;
        chart.update('none');
      });
      if (done < 1000) {
        setTimeout(tick, 8);
      } else {
        running = false;
        runBtn.textContent = '🔄 再跑 1000 个';
        runBtn.disabled = false;
      }
    };
    tick();
  };
  stopBtn.onclick = () => { running = false; runBtn.textContent = '▶ 继续跑'; runBtn.disabled = false; };
}

// 素数筛
function _pr06Sieve(limit) {
  const isPrime = new Uint8Array(limit + 1).fill(1);
  isPrime[0] = isPrime[1] = 0;
  for (let i = 2; i * i <= limit; i++) {
    if (isPrime[i]) {
      for (let j = i * i; j <= limit; j += i) isPrime[j] = 0;
    }
  }
  const primes = [];
  for (let i = 2; i <= limit; i++) if (isPrime[i]) primes.push(i);
  return { isPrime, primes };
}
function _pr06GoldbachPairs(N, isPrime) {
  const pairs = [];
  for (let p = 2; p <= N / 2; p++) {
    if (isPrime[p] && isPrime[N - p]) pairs.push([p, N - p]);
  }
  return pairs;
}

function initStage_PR06_s1() {
  const nInput = document.getElementById('pr06s1-n');
  const nShow = document.getElementById('pr06s1-N');
  const countEl = document.getElementById('pr06s1-count');
  const pairsEl = document.getElementById('pr06s1-pairs');
  if (!nInput) return;
  const update = () => {
    const N = Math.max(4, Math.min(99999, parseInt(nInput.value) || 100));
    if (N % 2 === 1) { nInput.value = N - 1; return update(); }
    nShow.textContent = N;
    const { isPrime } = _pr06Sieve(N);
    const pairs = _pr06GoldbachPairs(N, isPrime);
    countEl.textContent = pairs.length;
    pairsEl.innerHTML = pairs.map(([a, b]) => `<span style="color:#7c3aed; font-weight:700;">${a}</span> + <span style="color:#7c3aed; font-weight:700;">${b}</span> = ${N}`).join('　');
    if (pairs.length === 0) {
      pairsEl.innerHTML = `<span style="color: #b91c1c; font-weight: 700;">😱 找不到！是反例！</span>`;
    }
  };
  nInput.oninput = update;
  document.querySelectorAll('.pr06s1-preset').forEach(btn => {
    btn.onclick = () => { nInput.value = btn.dataset.n; update(); };
  });
  update();
}

function initStage_PR06_s2() {
  const maxInput = document.getElementById('pr06s2-max');
  const runBtn = document.getElementById('pr06s2-run');
  const maxR = document.getElementById('pr06s2-maxR');
  const gridG = document.getElementById('pr06s2-grid');
  const line = document.getElementById('pr06s2-line');
  const dotsG = document.getElementById('pr06s2-dots');
  if (!runBtn) return;
  const W = 600, H = 280, PAD_L = 35, PAD_B = 25, PAD_T = 10, PAD_R = 15;
  const draw = () => {
    const maxN = Math.max(10, Math.min(2000, parseInt(maxInput.value) || 500));
    const { isPrime } = _pr06Sieve(maxN);
    const data = [];
    let maxRval = 0;
    for (let n = 4; n <= maxN; n += 2) {
      const r = _pr06GoldbachPairs(n, isPrime).length;
      data.push([n, r]);
      if (r > maxRval) maxRval = r;
    }
    maxR.textContent = `最大 R(N) = ${maxRval}`;
    gridG.innerHTML = ''; dotsG.innerHTML = '';
    // 网格
    for (let i = 0; i <= 4; i++) {
      const y = PAD_T + (H - PAD_T - PAD_B) * i / 4;
      const ln = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      ln.setAttribute('x1', PAD_L); ln.setAttribute('y1', y);
      ln.setAttribute('x2', W - PAD_R); ln.setAttribute('y2', y);
      ln.setAttribute('stroke', '#e9d5ff'); ln.setAttribute('stroke-width', '0.5');
      gridG.appendChild(ln);
      const v = Math.round(maxRval * (1 - i / 4));
      const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      t.setAttribute('x', PAD_L - 4); t.setAttribute('y', y + 3);
      t.setAttribute('text-anchor', 'end');
      t.setAttribute('font-size', '9'); t.setAttribute('fill', '#9ca3af');
      t.textContent = v;
      gridG.appendChild(t);
    }
    for (let v = 0; v <= maxN; v += Math.max(100, Math.floor(maxN / 5))) {
      const x = PAD_L + (W - PAD_L - PAD_R) * v / maxN;
      const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      t.setAttribute('x', x); t.setAttribute('y', H - PAD_B + 14);
      t.setAttribute('text-anchor', 'middle');
      t.setAttribute('font-size', '9'); t.setAttribute('fill', '#9ca3af');
      t.textContent = v;
      gridG.appendChild(t);
    }
    const innerW = W - PAD_L - PAD_R, innerH = H - PAD_T - PAD_B;
    const xs = data.map(([n]) => PAD_L + innerW * n / maxN);
    const ys = data.map(([, r]) => PAD_T + innerH * (1 - r / Math.max(1, maxRval)));
    line.setAttribute('points', xs.map((x, i) => `${x.toFixed(1)},${ys[i].toFixed(1)}`).join(' '));
    // 关键点（N=100 高亮）
    if (maxN >= 100) {
      const idx = data.findIndex(([n]) => n === 100);
      if (idx >= 0) {
        const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        c.setAttribute('cx', xs[idx]); c.setAttribute('cy', ys[idx]); c.setAttribute('r', '5');
        c.setAttribute('fill', '#ec4899'); c.setAttribute('stroke', 'white'); c.setAttribute('stroke-width', '2');
        dotsG.appendChild(c);
        const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        t.setAttribute('x', xs[idx] + 8); t.setAttribute('y', ys[idx] - 6);
        t.setAttribute('font-size', '10'); t.setAttribute('font-weight', '700'); t.setAttribute('fill', '#ec4899');
        t.textContent = `N=100: ${data[idx][1]} 配对`;
        dotsG.appendChild(t);
      }
    }
  };
  runBtn.onclick = draw;
  maxInput.oninput = draw;
  draw();
}

function initStage_PR06_s5() {
  const doneEl = document.getElementById('pr06s5-done');
  const yesEl = document.getElementById('pr06s5-yes');
  const noEl = document.getElementById('pr06s5-no');
  const progEl = document.getElementById('pr06s5-progress');
  const chartCv = document.getElementById('pr06s5-chart');
  const runBtn = document.getElementById('pr06s5-run');
  const stopBtn = document.getElementById('pr06s5-stop');
  if (!runBtn) return;
  let running = false;
  let hist = Array(20).fill(0);
  let chart = null;
  if (chart) { try { chart.destroy(); } catch(e){} }
  chart = new Chart(chartCv.getContext('2d'), {
    type: 'bar',
    data: { labels: Array.from({length: 20}, (_, i) => i.toString()),
      datasets: [{ label: '偶数个数', data: hist, backgroundColor: '#a855f7', borderColor: '#7c3aed', borderWidth: 1 }] },
    options: { responsive: false, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: { x: { title: { display: true, text: '配对数' } }, y: { beginAtZero: true } } }
  });
  let yes = 0, no = 0, done = 0, total = 0;
  const updateDisplay = () => {
    doneEl.textContent = `${done} / ${total}`;
    yesEl.textContent = yes; noEl.textContent = no;
    progEl.style.width = (total ? done * 100 / total : 0) + '%';
  };
  runBtn.onclick = () => {
    if (running) return;
    running = true;
    yes = 0; no = 0; done = 0; hist = Array(20).fill(0);
    const { isPrime } = _pr06Sieve(1000);
    const Ns = [];
    for (let n = 4; n <= 1000; n += 2) Ns.push(n);
    total = Ns.length;
    runBtn.textContent = '⏳ 扫中...'; runBtn.disabled = true;
    const tick = () => {
      if (!running) return;
      const n = Ns[done];
      const pairs = _pr06GoldbachPairs(n, isPrime);
      if (pairs.length > 0) yes++; else no++;
      if (pairs.length < 20) hist[pairs.length]++;
      done++;
      updateDisplay();
      chart.data.datasets[0].data = hist;
      chart.update('none');
      if (done < Ns.length) {
        setTimeout(tick, 5);
      } else {
        running = false;
        runBtn.textContent = '🔄 再扫一遍'; runBtn.disabled = false;
      }
    };
    tick();
  };
  stopBtn.onclick = () => { running = false; runBtn.textContent = '▶ 继续扫'; runBtn.disabled = false; };
  updateDisplay();
}

  const pairsEl = document.getElementById('pr07s1-pairs');
  if (!pairsEl) return;
  const { isPrime } = _pr06Sieve(100);
  const pairs = [];
  for (let p = 3; p <= 100; p++) {
    if (isPrime[p] && isPrime[p + 2]) pairs.push([p, p + 2]);
  }
  pairsEl.innerHTML = pairs.map(([a, b]) =>
    `<div style="padding: 6px 12px; background: linear-gradient(135deg, #fce7f3, #fae8ff); border: 2px solid #ec4899; border-radius: 8px; font-family: 'Courier New', monospace; font-weight: 700; color: #be185d;">
      (${a}, ${b})
    </div>`
  ).join('');
}

function initStage_PR07_s2() {
  const svg = document.getElementById('pr07s2-svg');
  const countEl = document.getElementById('pr07s2-count');
  if (!svg) return;
  const { isPrime } = _pr06Sieve(1000);
  const twinG = document.getElementById('pr07s2-twin');
  const primeG = document.getElementById('pr07s2-prime');
  twinG.innerHTML = ''; primeG.innerHTML = '';
  let count = 0;
  // 数轴范围 0-1000 映射到 SVG x: 10-990
  const xOf = n => 10 + n * 980 / 1000;
  for (let p = 3; p <= 998; p++) {
    if (isPrime[p] && isPrime[p + 2]) {
      // 画连接线
      const ln = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      ln.setAttribute('x1', xOf(p)); ln.setAttribute('y1', 90);
      ln.setAttribute('x2', xOf(p + 2)); ln.setAttribute('y2', 90);
      ln.setAttribute('stroke', '#ec4899'); ln.setAttribute('stroke-width', '1.5');
      ln.setAttribute('opacity', '0.6');
      twinG.appendChild(ln);
      // 两个圆点
      for (const q of [p, p + 2]) {
        const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        c.setAttribute('cx', xOf(q)); c.setAttribute('cy', 90); c.setAttribute('r', '4');
        c.setAttribute('fill', '#a855f7');
        twinG.appendChild(c);
      }
      count++;
    }
  }
  // 其他素数（蓝点）
  for (let p = 2; p <= 1000; p++) {
    if (isPrime[p] && (!isPrime[p - 2] || p < 5) && (!isPrime[p + 2] || p > 998)) {
      const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      c.setAttribute('cx', xOf(p)); c.setAttribute('cy', 90); c.setAttribute('r', '2.5');
      c.setAttribute('fill', '#3b82f6');
      primeG.appendChild(c);
    }
  }
  // 刻度
  for (let v = 0; v <= 1000; v += 200) {
    const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    t.setAttribute('x', xOf(v)); t.setAttribute('y', 160);
    t.setAttribute('text-anchor', 'middle');
    t.setAttribute('font-size', '11'); t.setAttribute('fill', '#6b7280');
    t.textContent = v;
    primeG.appendChild(t);
  }
  countEl.textContent = count;
}

function initStage_PR07_s4() {
  const doneEl = document.getElementById('pr07s4-done');
  const countEl = document.getElementById('pr07s4-count');
  const progEl = document.getElementById('pr07s4-progress');
  const listEl = document.getElementById('pr07s4-list');
  const runBtn = document.getElementById('pr07s4-run');
  const stopBtn = document.getElementById('pr07s4-stop');
  if (!runBtn) return;
  let running = false;
  const reset = () => { listEl.innerHTML = ''; };
  reset();
  runBtn.onclick = () => {
    if (running) return;
    running = true;
    reset();
    const { isPrime } = _pr06Sieve(10000);
    let count = 0, done = 0;
    runBtn.textContent = '⏳ 扫中...'; runBtn.disabled = true;
    const tick = () => {
      if (!running) return;
      done++;
      for (let p = 3; p <= 9998; p++) {
        if (isPrime[p] && isPrime[p + 2]) {
          count++;
          const item = document.createElement('div');
          item.textContent = `(${p}, ${p + 2})`;
          listEl.appendChild(item);
        }
      }
      doneEl.textContent = `${done} / 10000`;
      countEl.textContent = count;
      progEl.style.width = done * 100 / 10000 + '%';
      if (done < 10000) {
        setTimeout(tick, 8);
      } else {
        running = false;
        runBtn.textContent = '🔄 再扫'; runBtn.disabled = false;
      }
    };
    tick();
  };
  stopBtn.onclick = () => { running = false; runBtn.textContent = '▶ 继续扫'; runBtn.disabled = false; };
}

/* ===================== 5 步直观讲解：PR08 π 的多算法对比 ===================== */
function _pr08Archimedes(n) { return n * Math.sin(Math.PI / n); }
function _pr08Leibniz(N) {
  let s = 0;
  for (let k = 0; k < N; k++) s += (k % 2 === 0 ? 1 : -1) / (2 * k + 1);
  return s * 4;
}
function _pr08Machin(N) {
  // π/4 = 4·arctan(1/5) - arctan(1/239)
  const arctan = (x, N) => {
    let s = 0;
    for (let k = 0; k < N; k++) s += (k % 2 === 0 ? 1 : -1) * Math.pow(x, 2 * k + 1) / (2 * k + 1);
    return s;
  };
  return 4 * (4 * arctan(1 / 5, N) - arctan(1 / 239, N));
}
function _pr08Chudnovsky(N) {
  // 1/π = 12 Σ (-1)^k (6k)! (545140134k + 13591409) / [(3k)! (k!)^3 640320^(3k+1/2)]
  // C = 426880 · √10005, M_k, X_k
  // π = C / (sum)
  const C = 426880 * Math.sqrt(10005);
  let sum = 0;
  for (let k = 0; k < N; k++) {
    const sign = k % 2 === 0 ? 1 : -1;
    const factorial = (n) => { let r = 1; for (let i = 2; i <= n; i++) r *= i; return r; };
    const M = factorial(6 * k) / (factorial(3 * k) * Math.pow(factorial(k), 3));
    const L = 545140134 * k + 13591409;
    const X = Math.pow(640320, 3 * k) / (Math.pow(24, k) * Math.pow(13591409, k) * Math.pow(640320, 3 * k));
    // simplify: X = 1 / (24^k · 13591409^k · 640320^(2k))
    const X2 = 1 / (Math.pow(24, k) * Math.pow(13591409, k) * Math.pow(640320, 2 * k));
    sum += sign * M * L * X2;
  }
  return C / sum;
}
function _pr08PiAll(N) {
  return {
    ar: _pr08Archimedes(N),
    lb: _pr08Leibniz(N),
    ma: _pr08Machin(N),
    ch: _pr08Chudnovsky(Math.min(N, 5)),
  };
}

function initStage_PR08_s1() {
  const slider = document.getElementById('pr08s1-n');
  const nvEl = document.getElementById('pr08s1-nv');
  const piEl = document.getElementById('pr08s1-pi');
  const errEl = document.getElementById('pr08s1-err');
  const poly = document.getElementById('pr08s1-poly');
  if (!slider) return;
  const update = () => {
    const n = +slider.value;
    nvEl.textContent = n;
    // 多边形顶点
    const pts = [];
    for (let i = 0; i < n; i++) {
      const angle = (i / n) * 2 * Math.PI - Math.PI / 2;
      pts.push(`${(100 * Math.cos(angle)).toFixed(2)},${(100 * Math.sin(angle)).toFixed(2)}`);
    }
    poly.setAttribute('points', pts.join(' '));
    const pi = _pr08Archimedes(n);
    piEl.textContent = pi.toFixed(4);
    errEl.textContent = Math.abs(pi - Math.PI).toFixed(4);
  };
  slider.oninput = update;
  document.querySelectorAll('.pr08s1-preset').forEach(btn => {
    btn.onclick = () => { slider.value = btn.dataset.n; update(); };
  });
  update();
}

function initStage_PR08_s2() {
  const slider = document.getElementById('pr08s2-n');
  const nvEl = document.getElementById('pr08s2-nv');
  const piEl = document.getElementById('pr08s2-pi');
  const errEl = document.getElementById('pr08s2-err');
  const line = document.getElementById('pr08s2-line');
  const dotsG = document.getElementById('pr08s2-dots');
  if (!slider) return;
  const W = 280, H = 220, PAD_L = 5, PAD_B = 5, PAD_T = 5, PAD_R = 5;
  // π 值的 Y 范围：3.0 ~ 3.3
  const yOf = v => PAD_T + (H - PAD_T - PAD_B) * (1 - (v - 3.0) / 0.3);
  const update = () => {
    const N = +slider.value;
    nvEl.textContent = N;
    const pts = [];
    const dots = [];
    let curPi = 0;
    for (let n = 1; n <= N; n++) {
      curPi = _pr08Leibniz(n);
      const x = PAD_L + (W - PAD_L - PAD_R) * (n / Math.max(1, N));
      const y = yOf(curPi);
      pts.push(`${x.toFixed(1)},${y.toFixed(1)}`);
      dots.push({ x, y });
    }
    line.setAttribute('points', pts.join(' '));
    piEl.textContent = curPi.toFixed(4);
    errEl.textContent = Math.abs(curPi - Math.PI).toFixed(4);
    dotsG.innerHTML = '';
    if (dots.length > 0) {
      const last = dots[dots.length - 1];
      const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      c.setAttribute('cx', last.x); c.setAttribute('cy', last.y); c.setAttribute('r', '4');
      c.setAttribute('fill', '#3b82f6');
      dotsG.appendChild(c);
    }
  };
  slider.oninput = update;
  update();
}

function initStage_PR08_s5() {
  const runBtn = document.getElementById('pr08s5-run');
  const maxInput = document.getElementById('pr08s5-max');
  const finalEl = document.getElementById('pr08s5-final');
  const chartCv = document.getElementById('pr08s5-chart');
  if (!runBtn) return;
  let chart = null;
  let currentAlgos = ['ar', 'lb', 'ma', 'ch'];
  if (chart) { try { chart.destroy(); } catch(e){} }
  chart = new Chart(chartCv.getContext('2d'), {
    type: 'line',
    data: {
      labels: [],
      datasets: [
        { label: 'Archimedes', data: [], borderColor: '#7c3aed', borderWidth: 2, pointRadius: 0, tension: 0 },
        { label: 'Leibniz', data: [], borderColor: '#3b82f6', borderWidth: 2, pointRadius: 0, tension: 0 },
        { label: 'Machin', data: [], borderColor: '#f59e0b', borderWidth: 2, pointRadius: 0, tension: 0 },
        { label: 'Chudnovsky', data: [], borderColor: '#10b981', borderWidth: 2, pointRadius: 0, tension: 0 },
        { label: '真 π', data: [], borderColor: '#ef4444', borderWidth: 1.5, borderDash: [4, 4], pointRadius: 0 },
      ]
    },
    options: {
      responsive: false, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { title: { display: true, text: 'N (迭代次数)' } },
        y: { title: { display: true, text: 'π 估值' }, min: 2.8, max: 3.3 }
      }
    }
  });
  const all = {
    ar: (n) => _pr08Archimedes(n),
    lb: (n) => _pr08Leibniz(n),
    ma: (n) => _pr08Machin(n),
    ch: (n) => _pr08Chudnovsky(n),
  };
  document.querySelectorAll('.pr08s5-algo').forEach(btn => {
    btn.onclick = () => {
      const algo = btn.dataset.algo;
      if (algo === 'all') currentAlgos = ['ar', 'lb', 'ma', 'ch'];
      else {
        const idx = currentAlgos.indexOf(algo);
        if (idx >= 0) currentAlgos.splice(idx, 1);
        else currentAlgos.push(algo);
        if (currentAlgos.length === 0) currentAlgos = [algo];
      }
      document.querySelectorAll('.pr08s5-algo').forEach(b => { b.classList.remove('primary'); b.classList.add('ghost'); });
      btn.classList.remove('ghost'); btn.classList.add('primary');
    };
  });
  const run = () => {
    const maxN = Math.max(2, Math.min(200, parseInt(maxInput.value) || 50));
    const labels = [];
    for (let n = 1; n <= maxN; n++) labels.push(n);
    chart.data.labels = labels;
    const data = { ar: [], lb: [], ma: [], ch: [] };
    for (let n = 1; n <= maxN; n++) {
      if (n <= 200) data.ar.push(all.ar(n));
      data.lb.push(all.lb(Math.min(n, 100)));
      data.ma.push(all.ma(n));
      data.ch.push(n <= 5 ? all.ch(n) : all.ch(5));
    }
    chart.data.datasets[0].data = data.ar;
    chart.data.datasets[1].data = data.lb;
    chart.data.datasets[2].data = data.ma;
    chart.data.datasets[3].data = data.ch;
    chart.data.datasets[4].data = labels.map(() => Math.PI);
    chart.update('none');
    // 显示 N=10 时的对比
    const at10 = {
      ar: all.ar(10).toFixed(6),
      lb: all.lb(10).toFixed(6),
      ma: all.ma(10).toFixed(6),
      ch: all.ch(2).toFixed(14),
    };
    finalEl.innerHTML = `<strong>N=10 时的对比</strong>：<br>
      🟣 Archimedes（10 边）：<strong>${at10.ar}</strong>（误差 ${(at10.ar - Math.PI).toFixed(4)}）<br>
      🔵 Leibniz（10 项）：<strong>${at10.lb}</strong>（误差 ${(at10.lb - Math.PI).toFixed(4)}）<br>
      🟡 Machin（10 项）：<strong>${at10.ma}</strong>（误差 ${(at10.ma - Math.PI).toExponential(2)}）<br>
      🟢 Chudnovsky（2 项）：<strong>${at10.ch}</strong>（误差 ${(at10.ch - Math.PI).toExponential(2)}）<br>
      <span style="color: #7c3aed; font-weight: 700;">差距：6 个数量级！</span>`;
  };
  runBtn.onclick = run;
  maxInput.oninput = run;
  run();
}

/* ===================== 通用 5 步工具函数（NT 系列共用） ===================== */
function _ntProperDivisors(n) {
  const out = [];
  for (let i = 1; i <= n / 2; i++) if (n % i === 0) out.push(i);
  return out;
}
function _ntSigma(n) { return _ntProperDivisors(n).reduce((a, b) => a + b, 0); }

function initStage_NT01_s3() {

  const perfectG = document.getElementById('nt01s3-perfect');
  const cntEl = document.getElementById('nt01s3-cnt');
  if (!runBtn) return;
  const draw = () => {
    const N = Math.max(100, Math.min(50000, parseInt(NInput.value) || 10000));
    barsG.innerHTML = ''; perfectG.innerHTML = '';
    // 画 σ 高度的条形（按 sigma 高度归一化）
    const xOf = n => 10 + n * 980 / N;
    let maxSigma = 0;
    const sigmas = [];
    for (let n = 2; n <= N; n++) {
      const s = _ntSigma(n);
      sigmas.push([n, s]);
      if (s > maxSigma) maxSigma = s;
    }
    // 抽 1/10 画线
    for (let i = 0; i < sigmas.length; i += 10) {
      const [n, s] = sigmas[i];
      const x = xOf(n), y = 100 - Math.min(80, s / maxSigma * 80);
      const ln = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      ln.setAttribute('x1', x); ln.setAttribute('y1', 100);
      ln.setAttribute('x2', x); ln.setAttribute('y2', y);
      ln.setAttribute('stroke', '#c4b5fd'); ln.setAttribute('stroke-width', '1');
      barsG.appendChild(ln);
    }
    // 高亮完美数
    let cnt = 0;
    for (const [n, s] of sigmas) {
      if (s === n) {
        cnt++;
        const x = xOf(n);
        const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        c.setAttribute('cx', x); c.setAttribute('cy', 100); c.setAttribute('r', '5');

        t.setAttribute('fill', '#be185d');
        t.textContent = n;
        perfectG.appendChild(t);
      }
    }
    cntEl.textContent = cnt;
  };
  runBtn.onclick = draw;

function initStage_NT03_s3() {
  const NInput = document.getElementById('nt03s3-N');

      const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');

      barsG.appendChild(r);
      if (s < n) d++; else if (s === n) p++; else a++;

function initStage_NT03_s4() {
  const runBtn = document.getElementById('nt03s4-run');
  const gridG = document.getElementById('nt03s4-grid');

  const infoEl = document.getElementById('nt03s4-info');
  if (!runBtn) return;
  const W = 600, H = 220, PAD_L = 35, PAD_B = 25, PAD_T = 10, PAD_R = 15;
  runBtn.onclick = () => {
    const Ns = [200, 500, 1000, 2000, 5000];
    const data = Ns.map(N => {
      let d = 0, p = 0, a = 0;
      for (let n = 2; n <= N; n++) {
        const s = _ntSigma(n);
        if (s < n) d++; else if (s === n) p++; else a++;
      }
      return { N, d: d / (N - 1), p: p / (N - 1), a: a / (N - 1) };
    });
    gridG.innerHTML = '';
    const maxN = 5000;
    for (let i = 0; i <= 4; i++) {
      const y = PAD_T + (H - PAD_T - PAD_B) * i / 4;
      const ln = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      ln.setAttribute('x1', PAD_L); ln.setAttribute('y1', y);
      ln.setAttribute('x2', W - PAD_R); ln.setAttribute('y2', y);
      ln.setAttribute('stroke', '#e9d5ff'); ln.setAttribute('stroke-width', '0.5');
      gridG.appendChild(ln);
    }
    for (let v = 0; v <= maxN; v += 1000) {
      const x = PAD_L + (W - PAD_L - PAD_R) * v / maxN;
      const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      t.setAttribute('x', x); t.setAttribute('y', H - PAD_B + 14);
      t.setAttribute('text-anchor', 'middle');
      t.setAttribute('font-size', '9'); t.setAttribute('fill', '#9ca3af');
      t.textContent = v;
      gridG.appendChild(t);
    }
    const innerW = W - PAD_L - PAD_R, innerH = H - PAD_T - PAD_B;
    const xs = data.map(d => PAD_L + innerW * d.N / maxN);
    const setLine = (line, key) => line.setAttribute('points', xs.map((x, i) => `${x.toFixed(1)},${(PAD_T + innerH * (1 - data[i][key])).toFixed(1)}`).join(' '));

function _nt05Happy(n) {
  const seen = new Set();
  let cur = n;
  while (cur !== 1 && !seen.has(cur)) {
    seen.add(cur);
    cur = String(cur).split('').reduce((a, d) => a + d * d, 0);
  }
  return cur === 1;
}
function _nt05Path(n) {
  const seen = new Set();
  const path = [n];
  let cur = n;
  while (cur !== 1 && !seen.has(cur)) {
    seen.add(cur);
    cur = String(cur).split('').reduce((a, d) => a + d * d, 0);
    path.push(cur);
  }
  return path;
}

function _nt09IsCarmichael(n) {
  // Korselt 判据：合数 n，对所有与 n 互素的 b，b^(n-1) ≡ 1 (mod n)
  if (n < 561) return false;
  // 简单质因数分解（n 不大）
  let temp = n;
  const factors = [];
  for (let p = 2; p * p <= temp; p++) {
    while (temp % p === 0) { factors.push(p); temp = temp / p; }
  }
  if (temp > 1) factors.push(temp);
  if (factors.length < 2) return false; // 不是合数
  // 必须每个素因子都出现 1 次（无平方）
  const uniq = [...new Set(factors)];
  if (uniq.length !== factors.length) return false;
  // n-1 必须被每个 (p-1) 整除
  for (const p of uniq) {
    if ((n - 1) % (p - 1) !== 0) return false;
  }
  return true;
}

function _nt10Factor(n) {
  const f = [];
  let temp = n;
  for (let p = 2; p * p <= temp; p++) {
    while (temp % p === 0) { f.push(p); temp = Math.floor(temp / p); }
  }
  if (temp > 1) f.push(temp);
  return f;
}
function _nt10IsSmith(n) {
  if (n < 4) return false;
  const f = _nt10Factor(n);
  if (f.length < 2) return false; // 必须合数
  const sumDigits = (x) => String(x).split('').reduce((a, d) => a + +d, 0);
  const nSum = sumDigits(n);
  const fSum = f.reduce((a, p) => a + sumDigits(p), 0);
  return nSum === fSum;
}

function initStage_NT10_s2() {
  const nInput = document.getElementById('nt10s2-n');
  const resultEl = document.getElementById('nt10s2-result');
  if (!nInput) return;
  const update = () => {
    const n = Math.max(4, Math.min(99999, parseInt(nInput.value) || 22));
    const factors = _nt10Factor(n);
    const nSum = String(n).split('').reduce((a, d) => a + +d, 0);
    const fSum = factors.reduce((a, p) => a + String(p).split('').reduce((b, d) => b + +d, 0), 0);
    const isSmith = _nt10IsSmith(n);
    resultEl.innerHTML = `
      <div style="margin-bottom: 6px;">n = <strong>${n}</strong> = ${factors.join(' × ')}</div>
      <div>n 各位数字和 = ${String(n).split('').join(' + ')} = <strong style="color: #7c3aed;">${nSum}</strong></div>
      <div>素因子数字和 = ${factors.map(p => String(p).split('').join('+')).join(' + ')} = <strong style="color: #7c3aed;">${fSum}</strong></div>
      <div style="margin-top: 8px; padding: 8px; background: ${isSmith ? '#dcfce7' : '#fee2e2'}; color: ${isSmith ? '#15803d' : '#b91c1c'}; border-radius: 6px; text-align: center; font-weight: 700;">
        ${isSmith ? `👤 ${n} 是 Smith 数！${nSum} = ${fSum} ✓` : `❌ ${n} 不是 Smith 数（${nSum} ≠ ${fSum}）`}
      </div>
    `;
  };
  nInput.oninput = update;
  document.querySelectorAll('.nt10s2-preset').forEach(btn => {
    btn.onclick = () => { nInput.value = btn.dataset.n; update(); };
  });
  update();
}

function initStage_SQ02_s3() {
  const g = document.getElementById('sq02s3-spiral');
  if (!g) return;
  const phi = (1 + Math.sqrt(5)) / 2;
  const rects = [];
  let x = 0, y = 0, w = 200, h = 200 / phi;
  for (let i = 0; i < 6; i++) {
    const colors = ['#7c3aed', '#ec4899', '#f59e0b', '#10b981', '#3b82f6', '#a855f7'];
    rects.push(`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="none" stroke="${colors[i]}" stroke-width="2"/>`);
    const newSize = h; // 剩下的是正方形
    if (i % 4 === 0) { y += h - newSize; w = newSize; }
    else if (i % 4 === 1) { x += w - newSize; w = h; h = newSize; }
    else if (i % 4 === 2) { x += 0; w = w; h = h; }
    else { y -= newSize; h = newSize; w = w; }
    h = w; w = h; // 简化：保持黄金矩形
  }
  g.innerHTML = rects.join('') + `<text x="200" y="240" text-anchor="middle" font-size="12" fill="#7c3aed" font-weight="700">φ ≈ 1.618 无限切</text>`;

  function derangements(n) {
    if (n === 0) return [[]];
    if (n === 1) return [];
    const result = [];
    const arr = Array.from({length: n}, (_, i) => i + 1);
    function permute(prefix, remaining) {
      if (remaining.length === 0) { result.push(prefix.slice()); return; }
      for (let i = 0; i < remaining.length; i++) {
        const next = remaining[i];
        if (prefix.length === 0 || prefix[prefix.length - 1] !== next) {
          prefix.push(next);
          permute(prefix, remaining.slice(0, i).concat(remaining.slice(i+1)));
          prefix.pop();
        }
      }
    }
    permute([], arr);
    return result.filter(p => p.every((v, i) => v !== i + 1));
  }

    btn.onclick = () => { nInput.value = btn.dataset.n; update(); };

function initStage_PE05_s1() {}

    let inside = 0;
    for (let i = 0; i < N; i++) {
      const x = Math.random(), y = Math.random();
      if (x*x + y*y <= 1) inside++;
    }
    const piEst = 4 * inside / N;
    resultEl.innerHTML = `撒 N=${N} 点<br>圆内 = ${inside}<br>π ≈ <strong>${piEst.toFixed(6)}</strong><br>真实 π = 3.141593<br>误差 = ${Math.abs(piEst - Math.PI).toFixed(6)}`;
  };
  nInput.oninput = update;

  });

function initStage_PE05_s3() {
  const canvas = document.getElementById('pe05s3-canvas');
  if (!canvas) return;
  canvas.width = 300; canvas.height = 300;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fef3c7'; ctx.fillRect(0, 0, 300, 300);
  // 画 1/4 圆弧
  ctx.fillStyle = '#fde68a';
  ctx.beginPath();
  ctx.moveTo(20, 280);
  ctx.lineTo(20, 20);
  ctx.lineTo(280, 20);
  ctx.arc(20, 20, 260, 0, Math.PI/2, false);
  ctx.closePath();
  ctx.fill();
  // 撒 500 个点
  let inside = 0, outside = 0;
  for (let i = 0; i < 500; i++) {
    const x = 20 + Math.random() * 260;
    const y = 20 + Math.random() * 260;
    const dx = x - 20, dy = y - 20;
    if (dx*dx + dy*dy <= 260*260) {
      ctx.fillStyle = '#2563eb';
      inside++;
    } else {
      ctx.fillStyle = '#dc2626';
      outside++;

function downloadDataUrl(dataUrl, filename) {
  const a = document.createElement('a');
  a.download = filename;
  a.href = dataUrl;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}
function svgToPng(svgEl) {
  return new Promise((resolve) => {
    try {
      const xml = new XMLSerializer().serializeToString(svgEl);
      const svg64 = btoa(unescape(encodeURIComponent(xml)));
      const img = new Image();
      img.onload = () => {
        const w = svgEl.clientWidth || svgEl.viewBox.baseVal.width || 360;
        const h = svgEl.clientHeight || svgEl.viewBox.baseVal.height || 360;
        const scale = 2;
        const canvas = document.createElement('canvas');
        canvas.width = w * scale;
        canvas.height = h * scale;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/png'));
      };
      img.onerror = () => resolve(null);
      img.src = 'data:image/svg+xml;base64,' + svg64;
    } catch (e) { resolve(null); }
  });
}
function downloadCanvas(canvas, filename) {
  // 给 canvas 周围加白底
  const w = canvas.width, h = canvas.height;
  const out = document.createElement('canvas');
  out.width = w; out.height = h;
  const ctx = out.getContext('2d');
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, w, h);
  ctx.drawImage(canvas, 0, 0);
  downloadDataUrl(out.toDataURL('image/png'), filename);
}
function timestamp() {
  const d = new Date();
  return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}_${String(d.getHours()).padStart(2,'0')}${String(d.getMinutes()).padStart(2,'0')}`;
}

/* ===================== 通用工具函数 ===================== */
function sumDigits(n) {
  n = Math.abs(n);
  let s = 0;
  while (n > 0) { s += n % 10; n = Math.floor(n / 10); }
  return s;
}
function factorize(n) {
  const out = [];
  for (let p = 2; p * p <= n; p++) {
    while (n % p === 0) { out.push(p); n = n / p; }
  }
  if (n > 1) out.push(n);
  return out;
}
function isPrimeSmall(n) {
  if (n < 2) return false;
  if (n < 4) return true;
  if (n % 2 === 0) return false;
  for (let p = 3; p * p <= n; p += 2) {
    if (n % p === 0) return false;
  }
  return true;
}
function divisors(n) {
  const out = [];
  for (let i = 1; i <= n; i++) if (n % i === 0) out.push(i);
  return out;
}
function properDivisors(n) { return divisors(n).filter(d => d < n); }
function factorial(n) {
  let r = 1; for (let i = 2; i <= n; i++) r *= i; return r;
}
function gcd(a, b) { return b === 0 ? a : gcd(b, a % b); }
function lcm(a, b) { return Math.abs(a * b) / gcd(a, b); }

  principle: "<h4>🔍 孪生素数是什么？</h4>\n<p>两个素数 p 和 p+2（相差 2）就是一对<strong>孪生素数</strong>。例子：<br>\n  (3, 5)、(5, 7)、(11, 13)、(17, 19)、(29, 31)、(41, 43)、(59, 61)、(71, 73)...</p>\n<p>(2, 3) 不算——差 1 不是孪生。还有<strong>三胞胎</strong>(p, p+2, p+6) 形式：5-7-11、11-13-17、17-19-23。</p>\n<h4>📐 孪生素数猜想</h4>\n<p>是否存在<strong>无穷多对</strong>孪生素数？<br>\n答案：<strong>几乎肯定有</strong>，但<strong>至今未严格证明</strong>。</p>\n<p>已找到最大孪生对：<strong>2,003,663,613 × 2¹⁹⁵,⁰⁰⁰ ± 1</strong>（约 58000 位数字）——但这只是\"找到\"，不是\"证明有无穷多\"。</p>\n<h4>🧠 张益唐 2013：里程碑</h4>\n<p>2013 年 5 月，<strong>Yitang Zhang</strong>（张益唐）证明：存在<strong>无穷多对</strong>素数相差 &lt; 7 × 10⁷。这是 100 年来对孪生素数猜想的最大突破。</p>\n<p>虽然没证明\"差 2\"（即真正的孪生），但把\"差无穷\"压到了\"差 7000 万\"。</p>\n<p><strong>2014 年</strong>，<strong>Polymath 8</strong>（开放式合作）几个月内把界压到 246。Maynard 独立给出更优界。</p>\n<h4>📊 密度规律（Hardy-Littlewood 1923）</h4>\n<p>孪生素数对数 ~ <span class=\"formula\">2·C₂ · ∫₂ᴺ dx/(ln x)²</span>，其中 <strong>C₂ ≈ 0.66</strong>（孪生素数常数）。</p>\n<p>实际：1000 以内有 35 对，10000 以内有 205 对——<strong>密度递减但永不归零</strong>。</p>",
  history: "<p><strong>1849 年</strong>，<strong>Alphonse de Polignac</strong> 提出更广的猜想：每个偶数都是某对素数之差（不只 2）——孪生猜想是特例。</p>\n<p><strong>1912 年</strong>，<strong>Edmund Landau</strong> 在国际数学家大会列出 4 个未解问题，\"孪生素数猜想\"排第 2——著名的 <strong>Landau 问题</strong>。</p>\n<p><strong>1923 年</strong>，<strong>Godfrey Hardy</strong> 和 <strong>John Littlewood</strong> 用<strong>圆法</strong>证明：在<strong>广义黎曼猜想</strong>下，孪生猜想成立。给出 <strong>C₂ = 0.66016...</strong>。</p>\n<p><strong>1966 年</strong>，<strong>Chen Jingrun</strong>（陈景润）证明：每个大偶数 = p + q（p 素数，q 几乎素数至多 2 因子）——<strong>陈氏定理</strong>，哥德巴赫问题的\"几乎证明\"。</p>\n<p><strong>2005 年</strong>，<strong>Daniel Goldston</strong>、<strong>János Pintz</strong>、<strong>Cem Yıldırım</strong> 证明：素数对差距 <strong>趋于 0</strong>（无穷多对差距任意小）。但具体差几还是不知道。</p>\n<p><strong>2013 年 5 月 13 日</strong>，<strong>Yitang Zhang</strong>（张益唐）独自投稿到 <em>Annals of Mathematics</em>，证明无穷多对差 &lt; 7000 万。审稿人 <strong>Henryk Iwaniec</strong> 和 <strong>Kevin Ford</strong> 4 月就收到，但 5 月才意识到重大。发表当天登上 <em>Nature</em>、<em>New York Times</em> 头条。</p>\n<p><strong>2013 年 8 月</strong>，<strong>Terence Tao</strong> 发起 <strong>Polymath 8</strong> 计划（开放式合作），几个月内把 7000 万压到 246。Maynard 独立给出更好的界。</p>\n<p><strong>2014 年至今</strong>，差距\"246\" 仍是最强界，差 2（真正的孪生）仍未证——但距目标越来越近。</p>",
  tryit: "<ol>\n  <li><strong>输入 100</strong>：看孪生对 (71, 73) 等。问孩子\"为什么 (3, 5) 后下一个是 (5, 7)？\"(因为 4 不是素数)。</li>\n  <li><strong>输入 1000</strong>：35 对孪生，最大 (881, 883)。散点图呈现\"沿 y=x+2 分布\"。</li>\n  <li><strong>输入 10000</strong>：205 对孪生。问孩子\"为什么密度变低？\"（素数越来越稀疏）。</li>\n  <li><strong>验证单数</strong>：输入 41 → 41 和 43 都是素数 → 孪生 ✓。输入 100 → 100 不是素数 → 不是孪生 ✗。</li>\n  <li><strong>看孪生 / 素数比</strong>：1000 内 168 个素数，35 对孪生 → 约 21%。10000 内 1229 个素数，205 对孪生 → 约 17%——密度递减但仍可观。</li>\n  <li><strong>扫到 100000</strong>：1224 对孪生，约 8 秒。问孩子\"如果扫到 1 亿呢？\"——100 亿对，约 10000 秒（3 小时）。</li>\n  <li><strong>张益唐的故事</strong>：跟孩子讲\"一个曾任赛百味店员的数学家，58 岁默默无闻，59 岁一鸣惊人——给全世界上了一节'坚持'课\"。</li>\n  <li><strong>教学金句</strong>：\"数学家验证到 4×10¹⁸ 都没反例，但证明不了——这就是数学的'看得见摸不着'。\"</li>\n</ol>",
  svgDemo: "",
  explain: "同学们好！今天我们来看素数里最有意思的一对——孪生素数。\n\n什么叫孪生素数？就是两个素数相差 2。3 和 5、5 和 7、11 和 13、17 和 19、29 和 31 都是孪生素数。注意 2 和 3 相差 1，不算。\n\n数学家们早就发现：孪生素数似乎有无穷多对。但 1000 以内有 35 对，10000 以内有 122 对，100 万以内有 8169 对——越往后越稀疏，但还是源源不断地冒出来。\n\n问题是：到底有没有无穷多对孪生素数？这就是\"孪生素数猜想\"。\n\n这个问题困扰了数学家 100 多年，看起来简单，但严格证明一直没有。\n\n直到公元二零一三年，华人数学家张益唐在数学顶刊《Annals of Mathematics》发表了一篇石破天惊的论文。他证明了：存在无穷多对素数，它们之间的差小于 7 乘以 10 的 7 次方，也就是 7000 万！\n\n虽然不是\"差等于 2\"——差是 7000 万——但这是有史以来第一次证明\"相邻素数之间的差有上界\"，是质数分布理论的重大突破！\n\n后来，Polymath 8 计划把这个上界从 7000 万降到了 246。2014 年，数学家 James Maynard 用一种全新方法，几乎同时把上界降到了 600。距离\"差等于 2\"还差一步，但这一步是最难的。\n\n现在已知的最大孪生素数对是 2,003,663,613 乘以 2 的 195000 次方减 1 和加 1，大约 58000 位数字——超级大！\n\n现在请同学们自己找：扫一段区间，看孪生素数有多密。Top 10 表格会列出蹦得最久的 10 个数。看看 1000 以内哪一对孪生素数最密？明天带过来我们比比谁找得多。\n\n记住：数学不只藏在书本里——藏在每一次\"看似无规律、实则有规律\"的素数海洋里。",

// ========== 3. 共享 JS：广场渲染 + plazaOpen + Twin + PiAlg ==========


/* ===================== 广场渲染 ===================== */
const plazaGrid = document.getElementById('plazaGrid');
const plazaSearch = document.getElementById('plazaSearch');
const plazaCats = document.getElementById('plazaCats');
const plazaClear = document.getElementById('plazaClear');
const plazaDetail = document.getElementById('plazaDetail');
let plazaCurrentCat = '全部';
let plazaCurrentExp = null;

function plazaRenderCats() {
  const cats = ['全部', ...Object.keys(PLAZA_CATEGORIES)];
  plazaCats.innerHTML = cats.map(c =>
    `<button class="ghost small" data-cat="${c}" style="${c === plazaCurrentCat ? 'background: var(--accent); color: white; border-color: var(--accent);' : ''}">${c}</button>`
  ).join('');
  plazaCats.querySelectorAll('button').forEach(b => {
    b.onclick = () => {
      plazaCurrentCat = b.dataset.cat;
      plazaRenderCats();
      plazaRenderGrid();
    };
  });
}

function plazaRenderGrid() {
  const q = plazaSearch.value.toLowerCase();
  const filtered = EXPERIMENTS.filter(e => {
    if (plazaCurrentCat !== '全部' && e.cat !== plazaCurrentCat) return false;
    if (q && !(e.id.toLowerCase().includes(q) || e.title.toLowerCase().includes(q) || e.intro.toLowerCase().includes(q) || e.cat.toLowerCase().includes(q))) return false;
    return true;
  });
  plazaGrid.innerHTML = filtered.map(e =>
    `<a class="plaza-card" href="pages/${e.id}.html" data-id="${e.id}" style="text-decoration: none; color: inherit; display: block;">
      <span class="cat-tag ${PLAZA_CATEGORIES[e.cat]}">${e.cat}</span>
      <span class="id-tag">${e.id}</span>
      <div class="title">${e.title}</div>
      <p class="intro">${e.intro}</p>
    </a>`
  ).join('');
  const cnt = document.getElementById('plazaCount');
  if (cnt) cnt.textContent = `共 ${EXPERIMENTS.length} 个实验（显示 ${filtered.length}）`;
}

function plazaOpen(id, setHash = true) {
  const exp = EXPERIMENTS.find(e => e.id === id);
  if (!exp) return;
  plazaCurrentExp = exp;
  plazaDetail.style.display = 'block';
  if (setHash) {
    // 用 hash 路由让每个实验有独立可分享 URL
    history.replaceState(null, '', `#${id}`);
    // 同步更新 <title>，方便分享/收藏
    document.title = `${exp.title}（${exp.id}） | 数学小实验广场`;
  }

  const prompt = `你是一位给小学数学竞赛班讲题的 AI 老师。请用 5 分钟能讲完、5 岁小孩能听懂的方式，给孩子们讲一下这个实验："${exp.title}"。

背景：${exp.intro}

要求：
1. 先用一个生活中的具体例子引出（比如"想象你手里有 N 颗糖……"）
2. 再讲清楚这个实验在算什么、为什么有趣
3. 讲完抛 1-2 个"想一想"或"试一试"问题让孩子回家玩
4. 总字数 ≤ 300 字

格式：用 markdown，简短段落，emoji 适量。`;

  // 自动生成"AI 通常会怎么讲"模板
  const exampleExplain = buildExampleExplain(exp);
  // 不再使用：Mavis 讲解替代了 AI 讲解模块，prompt 已存到项目目录
  void exampleExplain;

  // 4 区布局：有 principle/history/tryit 的（精选 8 个）显示完整 4 区
  const hasRichContent = exp.principle || exp.history || exp.tryit;

  // 5 步直观讲解：精选 8 个的渐进式可视化教学
  const stagesSection = exp.stages && exp.stages.length ? `
    <details open style="margin-bottom: 18px;">
      <summary style="cursor: pointer; font-weight: 700; padding: 10px 0; font-size: 16px; color: #7c3aed;">🌱 一步步玩懂（5 步直观讲解）</summary>
      <div style="background: linear-gradient(135deg, #faf5ff 0%, #fefce8 100%); border-left: 5px solid #a855f7; padding: 14px 18px; border-radius: 8px; margin-top: 8px;">
        <div class="stage-tabs" id="stageTabs-${exp.id}">
          ${exp.stages.map((s, i) => `
            <button class="stage-tab ${i === 0 ? 'active' : ''}" data-step="${i}" data-exp="${exp.id}">
              <span class="stage-num">${i + 1}</span>
              <span class="stage-emoji">${s.emoji || '🔹'}</span>
              <span class="stage-title">${s.title}</span>
            </button>
          `).join('')}
        </div>
        <div class="stage-panels" id="stagePanels-${exp.id}">
          ${exp.stages.map((s, i) => `
            <div class="stage-panel ${i === 0 ? 'active' : ''}" data-step="${i}" id="stagePanel-${exp.id}-${i}">
              ${s.content}
            </div>
          `).join('')}
        </div>
      </div>
    </details>` : '';

  const principleSection = exp.principle ? `
    <details style="margin-bottom: 14px;">
      <summary style="cursor: pointer; font-weight: 700; padding: 10px 0; font-size: 16px; color: #1e40af;">📐 原理讲解（深入浅出）</summary>
      <div style="background: linear-gradient(to right, #eff6ff, #f0f9ff); border-left: 5px solid #3b82f6; padding: 18px 22px; border-radius: 8px; font-size: 14px; line-height: 1.8; margin-top: 8px;">
        ${exp.principle}
      </div>
    </details>` : '';

  const historySection = exp.history ? `
    <details style="margin-bottom: 14px;">
      <summary style="cursor: pointer; font-weight: 700; padding: 10px 0; font-size: 16px; color: #7c2d12;">📜 ② 历史背景</summary>
      <div style="background: linear-gradient(to right, #fef3c7, #fffbeb); border-left: 5px solid #f59e0b; padding: 18px 22px; border-radius: 8px; font-size: 14px; line-height: 1.8; margin-top: 8px;">
        ${exp.history}
      </div>
    </details>` : '';

  const tryitSection = exp.tryit ? `
    <details style="margin-bottom: 14px;">
      <summary style="cursor: pointer; font-weight: 700; padding: 10px 0; font-size: 16px; color: #065f46;">🎮 ③ 试一试（一步步引导）</summary>
      <div style="background: linear-gradient(to right, #ecfdf5, #f0fdf4); border-left: 5px solid #10b981; padding: 18px 22px; border-radius: 8px; font-size: 14px; line-height: 1.8; margin-top: 8px;">
        ${exp.tryit}

function setupTwin(root) {
  root.innerHTML = TWIN_HTML;
  tpN = document.getElementById('tpN');
  tpRun = document.getElementById('tpRun');
  tpStatus = document.getElementById('tpStatus');
  tpChartCv = document.getElementById('tpChart');
  tpPrimeTotal = document.getElementById('tpPrimeTotal');
  tpTwinCount = document.getElementById('tpTwinCount');
  tpRatio = document.getElementById('tpRatio');
  tpLargest = document.getElementById('tpLargest');
  tpCheck = document.getElementById('tpCheck');
  tpCheckBtn = document.getElementById('tpCheckBtn');
  tpIsP1 = document.getElementById('tpIsP1');
  tpIsP2 = document.getElementById('tpIsP2');
  tpIsTwin = document.getElementById('tpIsTwin');

  if (tpChart) { try { tpChart.destroy(); } catch(e){} tpChart = null; }
  tpChart = new Chart(tpChartCv.getContext('2d'), {
    type: 'scatter',
    data: { datasets: [{ label: '孪生素数对 (n, n+2)', data: [], backgroundColor: '#2563eb', pointRadius: 3 }] },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: 'top', labels: { font: { size: 12 } } } },
      scales: {
        x: { title: { display: true, text: '小素数 n' } },
        y: { title: { display: true, text: '大素数 n+2' } },
      }
    }
  });

  tpRun.onclick = tpScan;
  tpCheckBtn.onclick = tpCheckOne;
  tpCheck.onkeypress = e => { if (e.key === 'Enter') tpCheckOne(); };
  tpN.onkeypress = e => { if (e.key === 'Enter') tpScan(); };

  tpScan();
  tpCheckOne();
}

function tpScan() {
  const N = +tpN.value;
  if (N < 100) { alert('至少扫 100'); return; }
  if (N > 500000) { alert('最多扫 500000'); return; }
  tpStatus.textContent = '扫描中…';
  tpRun.disabled = true;
  setTimeout(() => {
    const isPrime = sieve(N + 2);
    const pairs = [];
    let primeTotal = 0;
    for (let i = 2; i <= N; i++) {
      if (isPrime[i]) {
        primeTotal++;
        if (isPrime[i + 2]) pairs.push([i, i + 2]);
      }
    }
    tpChart.data.datasets[0].data = pairs.map(p => ({ x: p[0], y: p[1] }));
    tpChart.data.datasets[0].pointBackgroundColor = pairs.length > 2000 ? 'rgba(37,99,235,0.4)' : '#2563eb';
    tpChart.data.datasets[0].pointRadius = pairs.length > 2000 ? 1.5 : 3;
    tpChart.update();
    tpPrimeTotal.textContent = primeTotal;
    tpTwinCount.textContent = pairs.length;
    tpRatio.textContent = primeTotal > 0 ? (pairs.length / primeTotal * 100).toFixed(1) + '%' : '0';
    if (pairs.length > 0) {
      const last = pairs[pairs.length - 1];
      tpLargest.textContent = `(${last[0]}, ${last[1]})`;
    } else {
      tpLargest.textContent = '—';
    }
    tpStatus.textContent = `扫完 1–${N}，找到 ${pairs.length} 对孪生素数`;
    tpRun.disabled = false;
  }, 50);
}

function tpCheckOne() {
  const n = +tpCheck.value;
  if (n < 2) { alert('请输入 ≥ 2 的正整数'); return; }
  const isPrime = sieve(n + 2);
  const p1 = isPrime[n] === 1;
  const p2 = isPrime[n + 2] === 1;
  tpIsP1.textContent = p1 ? '✓ 素数' : '✗ 不是';
  tpIsP1.style.color = p1 ? '#059669' : '#dc2626';
  tpIsP2.textContent = p2 ? '✓ 素数' : '✗ 不是';
  tpIsP2.style.color = p2 ? '#059669' : '#dc2626';
  const isTwin = p1 && p2;
  tpIsTwin.textContent = isTwin ? `✓ ${n} 和 ${n+2} 是孪生素数` : `✗ 不是孪生素数`;
  tpIsTwin.style.color = isTwin ? '#059669' : '#dc2626';
}

/* ===================== Pi Algorithms ===================== */

function setupPiAlg(root) {

  piN = document.getElementById('piN');

function archimedesPi(n) {
  return n * Math.sin(Math.PI / n);
}

function leibnizPi(N) {
  let s = 0;
  for (let k = 0; k < N; k++) {
    s += (k % 2 === 0 ? 1 : -1) / (2 * k + 1);
  }
  return 4 * s;
}

function arctan(x, N) {
  let s = 0;
  let x2k1 = x;
  for (let k = 0; k < N; k++) {
    s += (k % 2 === 0 ? 1 : -1) * x2k1 / (2 * k + 1);
    x2k1 *= x * x;
  }
  return s;
}

function machinPi(N) {
  return 4 * (4 * arctan(1/5, N) - arctan(1/239, N));
}

function chudnovskyPi(N) {
  const C = 426880 * Math.sqrt(10005);
  let sum = 0;
  for (let k = 0; k < N; k++) {
    let num = 1;
    for (let i = 1; i <= 6 * k; i++) num *= i;
    let den = 1;
    for (let i = 1; i <= 3 * k; i++) den *= i;
    let kFact = 1;
    for (let i = 1; i <= k; i++) kFact *= i;
    den *= kFact * kFact * kFact;
    const term = num / den * (545140134 * k + 13591409) / Math.pow(640320, 3 * k);
    sum += (k % 2 === 0 ? 1 : -1) * term;
  }
  return C / sum;
}

function piRunAll() {
  const N = +piN.value;
  if (N < 1) { alert('至少 1 项'); return; }
  if (N > 100000) { alert('最多 100000 项（Leibniz 太慢）'); return; }
  piStatus.textContent = '计算中…';
  piRun.disabled = true;
  setTimeout(() => {
    const samples = Math.min(N, 50);
    const labels = [];
    const dataA = [], dataL = [], dataM = [], dataC = [];
    for (let s = 1; s <= samples; s++) {
      labels.push(s);
      const aSides = 6 * Math.pow(2, s - 1);
      dataA.push(archimedesPi(aSides));
      dataL.push(leibnizPi(s * Math.ceil(N / samples)));
      dataM.push(machinPi(s * Math.ceil(N / samples)));
      dataC.push(chudnovskyPi(s));
    }
    piChart.data.labels = labels;
    piChart.data.datasets[0].data = dataA;
    piChart.data.datasets[1].data = dataL;
    piChart.data.datasets[2].data = dataM;
    piChart.data.datasets[3].data = dataC;
    piChart.update();
    piA.textContent = dataA[dataA.length - 1].toFixed(8);
    piL.textContent = dataL[dataL.length - 1].toFixed(8);
    piM.textContent = dataM[dataM.length - 1].toFixed(8);
    piC.textContent = dataC[dataC.length - 1].toFixed(8);
    piStatus.textContent = `算完 N=${N}，采样 ${samples} 次`;
    piRun.disabled = false;
  }, 50);
}
